  h += `<p class="situation">${esc(TC.i18n.tx(q.situation))}</p>`;
  if (q.context && q.context.length) h += `<ul class="ctx">${q.context.map(c => `<li>${esc(TC.i18n.tx(c))}</li>`).join('')}</ul>`;
  h += binary ? `<p class="qlabel" id="qprompt">${esc(t('game.statement'))}</p><p class="statement">${esc(TC.i18n.tx(q.question))}</p>`
              : `<h2 class="qtext" id="qprompt">${esc(TC.i18n.tx(q.question))}</h2>`;
  return h;
};

G.answers = s => {
  const q = s.question, binary = !!TC.engine.BINARY[q.type], r = s.result, locked = !!r;
  return `<div class="answers${binary ? ' binary' : ''}${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${s.options.map((id, i) => {
    let cls = '', tag = '';
    if (locked) {
      if (id === q.correctAnswer) { cls = 'is-right'; tag = `<span class="tag">${tick}${esc(t('game.rightAnswer'))}</span>`; }
      else if (id === r.answer) { cls = 'is-wrong'; tag = `<span class="tag">${cross}${esc(t('game.yourAnswer'))}</span>`; }
    }
    const pressed = locked ? id === r.answer : s.draft === id;
    return `<button class="ans ${cls}" data-action="select" data-id="${esc(id)}" aria-pressed="${pressed}"${locked ? ' aria-disabled="true"' : ''}>${binary ? '' : `<span class="k" aria-hidden="true">${TC.i18n.key(i)}</span>`}<span class="lbl">${esc(G.optionLabel(q, id))}${tag}</span></button>`;
  }).join('')}</div>`;
};

G.sources = (q, open) => `<div class="card src glass"><button class="srctoggle" data-action="toggleSources" aria-expanded="${!!open}" aria-controls="srcpanel">${esc(t(open ? 'game.hideSource' : 'game.checkSource'))} (${q.sources.length})${chev}</button>
  <div id="srcpanel"${open ? '' : ' hidden'}><ul class="srclist">${TC.ui.sortSources(q.sources).map(src => `<li><a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer"><span class="ty ${esc(src.type)}">${esc(t('game.srcTypes.' + src.type))}</span><span><bdi lang="en" dir="ltr">${esc(src.title)}</bdi><span class="u" lang="en" dir="ltr">${esc(src.url.replace(/^https?:\/\//, ''))}</span></span>${ext}</a></li>`).join('')}</ul><p class="note">${esc(t('game.srcNote'))}${q.review && q.review.checked ? ' ' + esc(TC.i18n.f('sources.checked', { d:TC.ui.fmtDate(q.review.checked) })) : ''}</p></div></div>`;

G.reveal = (s, ui) => {
  const q = s.question, r = s.result; if (!r) return '';
  const decision = q.type === 'decision';
  const head = decision ? t(r.correct ? 'game.happened' : 'game.otherWay') : t(r.correct ? 'game.correct' : 'game.notQuite');
  return `<section class="reveal" id="reveal" aria-labelledby="verdict">
    <h2 class="verdict ${r.correct ? 'ok' : 'no'}" id="verdict" tabindex="-1">${r.correct ? tick : cross}<span>${esc(head)}</span></h2>
    <div class="card what glass"><h3>${esc(t('game.whatHappened'))}</h3><p>${esc(TC.i18n.tx(q.explanation))}</p>${decision ? `<p class="note">${esc(t('game.decisionNote'))}</p>` : ''}</div>
    ${q.didYouKnow ? `<div class="card dyk glass"><h3>${esc(t('game.dyk'))}</h3><p>${esc(TC.i18n.tx(q.didYouKnow))}</p></div>` : ''}
    ${G.sources(q, ui.sourcesOpen)}
  </section>`;
};

G.action = s => {
  if (s.phase === 'question') { const ok = s.canLock(); return `<div class="actionbar"><button class="btn btn-primary" style="width:100%" data-action="lock"${ok ? '' : ' disabled'}>${esc(t(ok ? 'game.lockIn' : 'game.makeChoice'))}</button></div>`; }
  const last = s.index + 1 >= s.total;
  return `<div class="actionbar"><button class="btn btn-primary" style="width:100%" data-action="next">${esc(t(last ? 'game.finish' : 'game.next'))}</button></div>`;
};
})();


/* ---- Phase 3: renderers per question family (choice · binary · map · order) ---- */
(function(){
const G = TC.ui.game, R = TC.ui.renderers = {};
const { tick, cross } = TC.ui.marks;
const tx = o => TC.i18n.tx(o);
const markTag = (ok, label) => `<span class="tag">${ok ? tick : cross}${esc(label)}</span>`;

R.choice = s => {
  const q = s.question, r = s.result, locked = !!r;
  return `<div class="answers${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${s.options.map((id, i) => {
    let cls = '', tag = '';
    if (locked) { if (id === q.correctAnswer) { cls = 'is-right'; tag = markTag(true, t('game.rightAnswer')); } else if (id === r.answer) { cls = 'is-wrong'; tag = markTag(false, t('game.yourAnswer')); } }
    else if (s.removed.includes(id)) cls = 'gone';
    return `<button class="ans ${cls}" data-action="select" data-id="${esc(id)}" aria-pressed="${locked ? id === r.answer : s.draft === id}"${locked ? ' aria-disabled="true"' : ''}${cls === 'gone' ? ' disabled' : ''}><span class="k" aria-hidden="true">${TC.i18n.key(i)}</span><span class="lbl">${esc(G.optionLabel(q, id))}${tag}</span></button>`;
  }).join('')}</div>`;
};
R.binary = s => {
  const q = s.question, r = s.result, locked = !!r;
  return `<div class="answers binary${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${s.options.map(id => {
    let cls = '', tag = '';
    if (locked) { if (id === q.correctAnswer) { cls = 'is-right'; tag = markTag(true, t('game.rightAnswer')); } else if (id === r.answer) { cls = 'is-wrong'; tag = markTag(false, t('game.yourAnswer')); } }
    return `<button class="ans ${cls}" data-action="select" data-id="${esc(id)}" aria-pressed="${locked ? id === r.answer : s.draft === id}"${locked ? ' aria-disabled="true"' : ''}><span class="lbl">${esc(G.optionLabel(q, id))}${tag}</span></button>`;
  }).join('')}</div>`;
};

/* map challenge: schematic map with lettered regions; buttons below are the accessible controls */
const REG = {
  sinai:{ pts:'198,254 245,258 288,262 315,253 323,260 353,361 340,392 330,430 320,456 315,466 290,430 255,380 222,338 213,332 205,300', c:[282,352] },
  gaza:{ pts:'315,253 332,237 341,243 323,260', c:[322,246] },
  westbank:{ pts:'360,180 372,176 393,186 391,205 390,225 386,248 372,250 360,249 357,235 362,222 357,210 361,196', c:[376,214] },
  golan:{ pts:'396,132 411,135 414,165 398,168 396,156', c:[405,150] }
};
TC.ui.REG = REG;
const letter = (q, id) => TC.i18n.key(q.answers.findIndex(a => a.id === id));
R.map = s => {
  const q = s.question, r = s.result, locked = !!r, chosen = locked ? r.answer : s.draft;
  const state = id => locked ? (id === q.correctAnswer ? 'ok' : id === r.answer ? 'no' : '') : (id === chosen ? 'sel' : (s.removed.includes(id) ? 'gone' : ''));
  let svg = `<svg class="mapq" viewBox="185 92 245 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t('game.mapNote'))}" focusable="false">
    <rect class="land" x="0" y="0" width="600" height="480"/><polygon class="sea" points="0,0 ${COAST}"/><polyline class="coast" points="${COAST}"/><polygon class="sea" points="${RED_SEA}"/><polygon class="coast" points="${RED_SEA}"/>
    <polygon class="terr" points="${ISRAEL_AREA}"/><ellipse class="sea" cx="388" cy="246" rx="4" ry="14"/><ellipse class="sea" cx="395" cy="160" rx="3.5" ry="6"/>
    <text class="lbl sea" x="250" y="170" text-anchor="middle">${esc(t('map.med'))}</text><text class="lbl" x="238" y="300" text-anchor="middle">${esc(t('map.egypt'))}</text><text class="lbl" x="420" y="290" text-anchor="middle">${esc(t('map.jordan'))}</text><text class="lbl" x="418" y="112" text-anchor="middle">${esc(t('map.syria'))}</text>`;
  q.answers.forEach(a => { const g = REG[a.id]; svg += `<polygon class="rg ${state(a.id)}" points="${g.pts}" data-action="select" data-id="${a.id}" aria-hidden="true"/>`; });
  q.answers.forEach(a => { const g = REG[a.id]; svg += `<circle cx="${g.c[0]}" cy="${g.c[1]}" r="15" fill="transparent" data-action="select" data-id="${a.id}" aria-hidden="true"/><text class="rlbl ${state(a.id)}" x="${g.c[0]}" y="${g.c[1] + 4}" text-anchor="middle">${letter(q, a.id)}</text>`; });
  svg += '</svg>';
  const btns = q.answers.map(a => {
    const id = a.id, L = letter(q, id); let cls = '', tag = '';
    if (locked) { if (id === q.correctAnswer) { cls = 'is-right'; tag = markTag(true, t('game.rightAnswer')); } else if (id === r.answer) { cls = 'is-wrong'; tag = markTag(false, t('game.yourAnswer')); } }
    if (!locked && s.removed.includes(id)) cls = 'gone';
    const label = locked ? t('map.regions.' + id) : TC.i18n.f('game.region', { l:L });
    return `<button class="ans ${cls}" data-action="select" data-id="${id}" aria-pressed="${locked ? id === r.answer : chosen === id}"${locked ? ' aria-disabled="true"' : ''}${cls === 'gone' ? ' disabled' : ''}><span class="k" aria-hidden="true">${L}</span><span class="lbl">${esc(label)}${tag}</span></button>`;
  }).join('');
  return `<div class="mapstage map">${svg}<span class="mapnote">${esc(t('game.mapNote'))}</span></div><div class="answers mapbtns${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${btns}</div>`;
};

/* order / timeline: tap items earliest → latest; tap again to remove */
R.order = s => {
  const q = s.question, r = s.result, locked = !!r;
  const placed = (locked ? r.answer : s.draft) || [];
  const ids = locked ? q.items.map(i => i.id) : s.layout;
  const rows = ids.map((id, pos) => {
    const it = q.items.find(i => i.id === id), n = placed.indexOf(id);
    if (locked) {
      const ok = placed[pos] === id;
      return `<li class="ans ord ${ok ? 'is-right' : 'is-wrong'}"><span class="k" aria-hidden="true">${pos + 1}</span><span class="lbl">${esc(tx(it.text))}${ok ? markTag(true, t('game.inPlace')) : markTag(false, TC.i18n.f('game.youPlaced', { n:n + 1 }))}</span><span class="yr">${esc(it.year)}</span></li>`;
    }
    return `<li><button class="ans ord${n >= 0 ? ' placed' : ''}${id === s.anchored ? ' anchored' : ''}" data-action="orderTap" data-id="${esc(id)}"${id === s.anchored ? ' disabled' : ''} aria-pressed="${n >= 0}" aria-label="${esc(tx(it.text))}${n >= 0 ? ' — ' + (n + 1) : ''}"><span class="k" aria-hidden="true">${n >= 0 ? n + 1 : ''}</span><span class="lbl">${esc(tx(it.text))}</span></button></li>`;
  }).join('');
  const reset = !locked && placed.length ? `<button class="btn btn-ghost btn-sm" data-action="orderReset" style="align-self:flex-start;margin-top:4px">${esc(t('game.resetOrder'))}</button>` : '';
  return `<p class="qlabel">${esc(locked ? t('game.correctOrder') : TC.i18n.f('game.placedCount', { n:placed.length, total:q.items.length }))}</p><ol class="answers orderlist${locked ? ' done' : ''}" aria-labelledby="qprompt">${rows}</ol>${reset}`;
};

G.answers = s => R[TC.schema.FAMILY(s.question.type)](s);

/* framing per type: headline card, perspectives split, binary claim, standard prompt */
G.question = s => {
  const q = s.question, fam = TC.schema.FAMILY(q.type);
  let h = `<p class="eyebrow"><span class="yr">${esc(q.year || '')}</span><span>${esc(t('game.types.' + q.type))}</span><span class="d">${esc(t('game.diff.' + q.difficulty))}</span></p>`;
  if (q.type === 'headline') h += `<figure class="headline"><figcaption>${esc(t('game.exampleHeadline'))}</figcaption><p lang="${TC.i18n.lang}">${esc(tx(q.headlineText))}</p></figure>`;
  h += `<p class="situation">${esc(tx(q.situation))}</p>`;
  const ctx = q.context || [];
  if (q.type === 'perspectives') h += `<div class="persp">${ctx.map((c, i) => `<div><b>${esc(t(i ? 'game.perspB' : 'game.perspA'))}</b>${esc(tx(c))}</div>`).join('')}</div>`;
  else if (ctx.length) h += `<ul class="ctx">${ctx.map(c => `<li>${esc(tx(c))}</li>`).join('')}</ul>`;
  h += fam === 'binary' ? `<p class="qlabel" id="qprompt">${esc(t('game.statement'))}</p><p class="statement">${esc(tx(q.question))}</p>`
                        : `<h2 class="qtext" id="qprompt">${esc(tx(q.question))}</h2>`;
  return h;
};
})();

})(window.TC);
</script>

<!-- ================= APP: screens · router · boot ================= -->
<script id="tc-app">
(function(TC){
'use strict';
const { esc, icon, ui } = TC;
const t = k => TC.i18n.t(k);
const app = document.getElementById('app');
const live = document.getElementById('live');
const announce = msg => { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 40); };

/* ---- screens: each returns markup; `after` runs once mounted ---- */
const SCREENS = {
  loading: {
    dim:false,
    view: () => `<section class="screen loading"><div class="stagecenter">${ui.logo()}<p class="tagline" style="font-size:16px">${esc(t('brand.tagline'))}</p><p class="dots" role="status">${esc(t('loading.line'))}</p></div></section>`
  },
  intro: {
    dim:false,
    view: p => {
      const d = p.fast ? 0 : (p.quick ? .28 : 1);   // returning players get a short intro
      return `<section class="screen intro${p.fast ? ' fast' : ''}" aria-labelledby="intro-title">
        <button class="skip" data-action="skipIntro">${esc(t('intro.skip'))}</button>
        <div class="stagecenter">
          <h1 id="intro-title" class="reveal" style="margin:0;animation-delay:${2.2 * d}s">${ui.logo()}</h1>
          <p class="tagline reveal" style="animation-delay:${3.1 * d}s">${esc(t('brand.tagline'))}</p>
          <p class="poem"><span class="reveal" style="animation-delay:${4.6 * d}s">${esc(t('intro.poem1'))}</span><span class="reveal" style="animation-delay:${5.5 * d}s">${esc(t('intro.poem2'))}</span><span class="reveal" style="animation-delay:${6.3 * d}s"><b>${esc(t('intro.poem3'))}</b></span></p>
          <div class="cta reveal" style="animation-delay:${7.3 * d}s">
            <button class="btn btn-primary" data-action="start">${esc(t('intro.start'))}</button>
            ${ui.langSwitch()}
          </div>
        </div></section>`;
    }
  },
  menu: {
    dim:false,
    view: () => `<section class="screen" aria-labelledby="menu-title">
      ${ui.topbar()}
      <div class="menu-hero"><h1 id="menu-title" style="margin:0">${ui.logo()}</h1><p class="tagline" style="font-size:15px">${esc(t('brand.tagline'))}</p></div>
      <nav class="nav" aria-label="${esc(t('common.menuLabel'))}">
        ${ui.continueItem ? ui.continueItem() : ''}
        <button class="btn btn-primary" data-action="nav" data-to="play">${icon('play')} ${esc(t('menu.play'))}</button>
        ${ui.navItem({ id:'daily', iconName:'calendar', label:t('menu.daily'), locked:true, featured:true })}
        <div class="nav-grid">
          ${ui.navItem({ id:'collection', iconName:'cards', label:t('menu.collection'), locked:true })}
          ${ui.navItem({ id:'achievements', iconName:'trophy', label:t('menu.achievements'), locked:true })}
          ${ui.navItem({ id:'how', iconName:'help', label:t('menu.how'), locked:true })}
          ${ui.navItem({ id:'sources', iconName:'book', label:t('menu.sources'), locked:true })}
        </div>
        ${ui.navItem({ id:'settings', iconName:'settings', label:t('menu.settings') })}
      </nav></section>`
  },
  play: {
    dim:true,
    view: () => `<section class="screen" aria-labelledby="play-title">
      ${ui.topbar({ back:true })}
      <h1 id="play-title" class="h1">${esc(t('play.title'))}</h1>
      <p class="lede">${esc(t('play.lede'))}</p>
      <div class="chapters">${TC.CHAPTERS.filter(c => TC.isChapterLive(c.id)).map(ui.chapterCard).join('')}</div></section>`
  },
  settings: {
    dim:true,
    view: () => {
      const m = TC.storage.getPref('motion');
      const mb = (v, k) => `<button data-action="motion" data-value="${v}" aria-pressed="${m === v}">${esc(t('settings.' + k))}</button>`;
      return `<section class="screen" aria-labelledby="set-title">
        ${ui.topbar({ back:true })}
        <h1 id="set-title" class="h1">${esc(t('settings.title'))}</h1>
        <div class="rows glass" style="margin-top:14px">
          <div class="row stack"><div><b>${esc(t('common.language'))}</b><p>${esc(t('settings.langSub'))}</p></div>${ui.langSwitch()}</div>
          <div class="row"><div><b>${esc(t('settings.sound'))}</b><p>${esc(t('settings.soundSub'))}</p></div>${ui.switchCtl('toggleSound', TC.storage.getPref('sound'), t('settings.sound'))}</div>
          <div class="row stack"><div><b>${esc(t('settings.motion'))}</b><p>${esc(t('settings.motionSub'))}</p></div><div class="seg" role="group" aria-label="${esc(t('settings.motion'))}">${mb('system', 'system')}${mb('full', 'full')}${mb('reduced', 'reduced')}</div></div>
        </div>
        <p class="footnote">${esc(t('settings.saved'))}</p></section>`;
    }
  }
};
const ROUTABLE = ['menu', 'play', 'settings'];

/* ---- router: hash routes for real screens; intro/loading are transient ---- */
let current = null, params = {};
let mount = function(name, p = {}){
  const def = SCREENS[name];
  if (def.guard) { const to = def.guard(p); if (to) return go(to); }
  current = name; params = p;
  app.innerHTML = def.view(p);
  document.body.classList.toggle('dim', !!def.dim);
  def.after && def.after(p);
  if (name !== 'loading' && name !== 'intro') { const lab = app.querySelector('h1') || app.querySelector('section[aria-label]'); announce(lab ? (lab.getAttribute('aria-label') || lab.textContent.trim()) : ''); }
  const h = app.querySelector('h1');
  if (h && ROUTABLE.includes(name)) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll:true }); }
};
function go(name){
  if (!ROUTABLE.includes(name)) return mount(name);
  const target = '#/' + name;
  if (location.hash !== target) location.hash = target; else route();
}
function route(){
  const name = (location.hash.match(/^#\/(\w+)/) || [])[1];
  if (!ROUTABLE.includes(name) || !booted) return;
  if (name !== current) { TC.audio.whoosh(); window.scrollTo(0, 0); }
  mount(name);
}
window.addEventListener('hashchange', route);

/* ---- actions (event delegation) ---- */
const ACTIONS = {
  nav: el => { TC.audio.tap(); go(el.dataset.to); },
  soon: () => { TC.audio.tap(); ui.toast(t('common.comingSoon')); },
  chapter: () => { TC.audio.tap(); ui.toast(t('play.chapterSoon')); },
  start: () => { TC.audio.unlock(); TC.audio.chime(); booted = true; go('menu'); },
  skipIntro: () => mount('intro', { fast:true }),
  lang: el => { TC.audio.tap(); TC.i18n.set(el.dataset.lang); },
  toggleSound: () => { const v = !TC.storage.getPref('sound'); TC.storage.setPref('sound', v); if (v) { TC.audio.unlock(); TC.audio.tap(); } mount(current, params); announce(t('settings.sound') + ': ' + (v ? 'on' : 'off')); },
  motion: el => { TC.audio.tap(); TC.storage.setPref('motion', el.dataset.value); mount(current, params); }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || !app.contains(el)) return;
  const fn = ACTIONS[el.dataset.action]; if (fn) fn(el);
});
// atmosphere can begin on the very first touch, even before START
window.addEventListener('pointerdown', function first(){ if (TC.storage.getPref('sound')) TC.audio.unlock(); window.removeEventListener('pointerdown', first); }, { once:true });

/* ---- re-render on language change; keep focus on the language control ---- */
TC.bus.on('lang', l => {
  renderBackground(true);
  mount(current, Object.assign({}, params, current === 'intro' ? { fast:true } : {}));
  const btn = app.querySelector(`[data-action="lang"][data-lang="${l}"]`); if (btn) btn.focus();
  announce(l === 'he' ? 'עברית' : 'English');
});

/* ---- background ---- */
function renderBackground(instant){
  const bm = document.getElementById('bgmap');
  bm.innerHTML = ui.map({ lit:true, delay:instant ? 0 : .9, step:instant ? 0 : .34 });
  if (instant) bm.querySelectorAll('.city').forEach(c => c.style.animationDelay = '0s');
}
function motes(){
  const m = document.getElementById('motes'); let h = '';
  for (let i = 0; i < 14; i++) h += `<i style="left:${(i * 73) % 100}%;animation-duration:${18 + (i * 7) % 16}s;animation-delay:${-(i * 3.1) % 20}s;opacity:.${2 + i % 3}"></i>`;
  m.innerHTML = h;
}


/* ================= Phase 2: game loop wiring ================= */
let session = null;
const ui2 = { sourcesOpen:false };
let saveRun = function(){ TC.storage.setSection('run', session && session.phase !== 'complete' ? session.toJSON() : null); };
function loadRun(){ const st = TC.storage.getSection('run'); return st ? TC.engine.Session.restore(st, TC.bank) : null; }

SCREENS.game = {
  dim:true,
  view: () => {
    if (!session || session.phase === 'complete') return '';
    return `<section class="screen" aria-label="${esc(TC.i18n.f('game.progress', { i:session.index + 1, n:session.total }))}">
      ${ui.game.header(session)}
      <div class="gamebody">
        ${ui.game.question(session)}
        ${typeof coachHTML === 'function' ? coachHTML() : ''}
        <div id="answers">${ui.game.answers(session)}</div>
        ${ui.game.reveal(session, ui2)}
        ${ui.game.action(session)}
      </div></section>`;
  },
  guard: () => (!session || session.phase === 'complete') ? 'play' : null
};
SCREENS.results = {
  dim:true,
  view: () => {
    const sum = session && session.phase === 'complete' ? session.summary() : null;
    if (!sum) return '';
    const ch = TC.CHAPTERS.find(c => c.id === sum.chapterId);
    return `<section class="screen results" aria-labelledby="res-title">
      ${ui.topbar({ back:true })}
      <p class="lab">${esc(t('play.chapter'))} ${TC.chapterNo(ch.id)} · ${esc(TC.i18n.tx(ch.name))}</p>
      <h1 id="res-title" class="h1" style="text-align:center">${esc(t('results.title'))}</h1>
      <p class="bigstat">${sum.correct}/${sum.total}</p><p class="lab">${esc(t('results.correct'))}</p>
      <p class="closing">${esc(TC.i18n.f('results.closing1', { n:sum.total }))}<b>${esc(t('results.closing2'))}</b></p>
      <ul class="rlist">${sum.results.map(r => { const q = TC.bank.get(r.id); return `<li class="glass ${r.correct ? 'ok' : 'no'}">${r.correct ? ui.marks.tick : ui.marks.cross}<span class="sr">${esc(t(r.correct ? 'game.correct' : 'game.notQuite'))}</span><span>${esc(TC.i18n.tx(q.question))}</span></li>`; }).join('')}</ul>
      <div class="btncol"><button class="btn btn-primary" data-action="chapter" data-id="${sum.chapterId}" data-fresh="1">${esc(t('results.again'))}</button>

ROUTABLE.push('game', 'results');

let renderGame = function(focusReveal){

  }
};

let startChapter = function(id, fresh){
  const saved = !fresh && loadRun();
  session = (saved && saved.chapterId === id) ? saved : TC.engine.Session.create(id, TC.bank);
  if (!session) { ui.toast(t('play.chapterSoon')); return; }

};

Object.assign(ACTIONS, {

/* Play screen: chapters with content become playable; resume state shown */
TC.ui.chapterCard = c => {

/* Keyboard: 1–9 choose, Enter locks / advances (when focus is not on a control) */
document.addEventListener('keydown', e => {
  if (current !== 'game' || !session || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (/^[1-9]$/.test(e.key) && session.phase === 'question') {
    if (session.kind === 'order') { const id = session.layout[+e.key - 1]; if (id) { e.preventDefault(); ACTIONS.orderTap({ dataset:{ id } }); } }
    else { const id = session.options[+e.key - 1]; if (id) { e.preventDefault(); ACTIONS.select({ dataset:{ id } }); } }
  } else if (e.key === 'Enter' && session.phase === 'question' && document.activeElement && document.activeElement.dataset.action === 'select' && document.activeElement.dataset.id === session.draft) {
    e.preventDefault(); ACTIONS.lock();                 // Enter on the chosen answer locks it in
  } else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') {
    e.preventDefault(); session.phase === 'question' ? ACTIONS.lock() : ACTIONS.next();
  }
});


/* ================= Phase 4: complete chapter experience ================= */
/* progress section: { chapters:{ id:{ completed, best, plays, last } }, coachSeen } */
const progress = () => Object.assign({ chapters:{}, coachSeen:false }, TC.storage.getSection('progress') || {});
const saveProgress = p => TC.storage.setSection('progress', p);
let lastOutcome = null;   // { newBest, firstClear } for the results screen
/* the ONLY engine:complete writer: chapter record, Insight totals, results badge */
TC.bus.on('engine:complete', s => {
  const sum = s.summary(), p = progress(), prev = p.chapters[sum.chapterId] || { completed:false, best:0, plays:0 };
  lastOutcome = { newBest: !!prev.completed && prev.bestScore != null && sum.score > prev.bestScore, firstClear: !prev.completed };
  p.chapters[sum.chapterId] = Object.assign({}, prev, { completed:true, best:Math.max(prev.best || 0, sum.correct), bestScore:Math.max(prev.bestScore || 0, sum.score),
    plays:(prev.plays || 0) + 1, last:sum.correct, total:sum.total });
  p.totals = Object.assign({ insight:0, bestStreak:0 }, p.totals); p.totals.insight += sum.bonus || 0;
  saveProgress(p);
});

/* ================= Phase 5: scoring · streaks · Focus · confidence · ledger ================= */
Object.assign(ui2, { qStart:{}, confidence:'safe', newLedger:[], pendingReveal:false });
const fmt = n => Number(n).toLocaleString(t('meta.locale'));
const sgn = n => '\u200E' + (n > 0 ? '+' : n < 0 ? '\u2212' : '') + fmt(Math.abs(n));
const totals = () => Object.assign({ insight:0, bestStreak:0 }, progress().totals || {});
function addInsight(n){ const p = progress(); p.totals = Object.assign({ insight:0, bestStreak:0 }, p.totals); p.totals.insight = Math.max(0, p.totals.insight + n); saveProgress(p); }
const allLedger = () => TC.content.all().flatMap(q => (q.ledger || []).map(l => Object.assign({ qid:q.id }, l)));

TC.bus.on('engine:lock', ({ session:s, result:r }) => {
  const p = progress(), q = TC.bank.get(r.id);
  p.totals = Object.assign({ insight:0, bestStreak:0 }, p.totals);
  p.totals.insight = Math.max(0, p.totals.insight + r.points);
  p.totals.bestStreak = Math.max(p.totals.bestStreak, s.bestStreak);
  const have = new Set(p.ledger || []), fresh = (q.ledger || []).map(l => l.id).filter(id => !have.has(id));

  saveProgress(p);
});

    <div class="prog" aria-hidden="true">${bars}</div>
    <span class="runscore" id="runscore" aria-label="${esc(t('score.insight'))} ${s.score}"><small>${esc(t('score.insight'))}</small><span id="runscoreval">${fmt(s.score)}</span></span></header>
    <div class="gmeta"><span class="pips" aria-label="${esc(TC.i18n.f('focus.left', { n:s.focus }))}">${esc(t('focus.label'))} ${[0,1,2].map(i => `<i class="${i < s.focus ? '' : 'u'}"></i>`).join('')}</span>
      ${tier ? `<span class="tier ${tier}">◆ ${esc(t('score.tiers.' + tier))}</span>` : ''}
      <span class="count" aria-label="${esc(TC.i18n.f('game.progress', { i:s.index + 1, n:s.total }))}">${s.index + 1}/${s.total}</span></div>`;
};

/* ---- fast-bonus bar: pure CSS, resumes at the right point after re-renders ---- */
function fastBar(s){
  if (s.phase !== 'question') return '';
  const q = s.question, win = TC.scoring.fastWindow(q);
  if (ui2.qStart[s.index] == null) ui2.qStart[s.index] = performance.now();
  const el = performance.now() - ui2.qStart[s.index];
  if (el >= win) return '';
  return `<div class="fastbar${q.type === 'decision' ? ' urgent' : ''}" aria-hidden="true"><i style="animation-duration:${win}ms;animation-delay:-${Math.round(el)}ms"></i></div><span class="fastlbl" aria-hidden="true">${esc(t('score.fastBonus'))} +${TC.scoring.RULES.fast}</span>`;
}

/* ---- Focus tools + clue ---- */
const TOOL_ICON = { remove:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>', source:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>', anchor:'<circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/>' };
function toolsHTML(s){
  if (s.phase !== 'question') return '';
  const fam = TC.schema.FAMILY(s.question.type);
  const list = fam === 'order' ? ['anchor', 'source'] : fam === 'binary' ? ['source'] : ['remove', 'source'];
  return `<div class="tools" role="group" aria-label="${esc(TC.i18n.f('focus.left', { n:s.focus }))}">${list.map(tl => `<button class="tool" data-action="focus" data-tool="${tl}"${s.canUse(tl) ? '' : ' disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TOOL_ICON[tl]}</svg>${esc(t('focus.' + tl))}</button>`).join('')}</div>`;
}
function clueHTML(s){
  const used = s.toolsUsed; let h = '';
  if (used.includes('source')) h += `<p class="clue" role="status">${esc(s.question.clue ? TC.i18n.tx(s.question.clue) : TC.i18n.f('focus.clue', { t:s.question.sources[0].title.replace(/^Wikipedia: /, '') }))}</p>`;
  if (used.includes('anchor') && s.phase === 'question') h += `<p class="clue" role="status">${esc(t('focus.anchored'))}</p>`;
  return h;
}

/* ---- reveal: points line + ledger entries ---- */

    h = h.replace('<div class="card src', card + '<div class="card src');

/* ---- verdict moment ---- */
function verdictFX(r, s){
  const q = s.question, decision = q.type === 'decision', tier = r.correct ? TC.scoring.tier(r.streak) : null;
  const word = decision ? t(r.correct ? 'game.happened' : 'game.otherWay') : t(r.correct ? 'game.correct' : 'game.notQuite');
  const d = document.createElement('div'); d.className = 'vfx ' + (r.correct ? 'ok' : 'no'); d.setAttribute('aria-hidden', 'true');
  d.innerHTML = `<div class="vb"><div class="vw${word.length > 12 ? ' long' : ''}">${esc(word)}</div>${r.points ? `<div class="vp">${sgn(r.points)}</div>` : ''}${r.parts.length > 1 ? `<div class="vs">${esc(r.parts.map(([k, v]) => t('score.parts.' + k) + ' ' + sgn(v)).join(' · '))}</div>` : ''}${tier && [3,5,10].includes(r.streak) ? `<div class="vt">${esc(t('score.tiers.' + tier))}</div>` : ''}</div>`;
  document.body.appendChild(d);
  const dur = TC.motion.reduced ? 500 : 700;
  setTimeout(() => d.remove(), dur);
  return dur;
}
function bumpScore(from, to){
  const el = document.getElementById('runscoreval'), chip = document.getElementById('runscore'); if (!el) return;
  chip.classList.add('bump'); setTimeout(() => chip.classList.remove('bump'), 450);
  if (TC.motion.reduced) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  (function step(now){ const k = Math.min(1, (now - t0) / 700); el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); })(t0);

const THEME_ORDER = ['price', 'treaty', 'sequence', 'founding', 'war', 'record', 'rescue', 'risk', 'context', 'claims', 'source'];
function verdictKey(sum){
  const missed = sum.results.filter(r => !r.correct);
  if (!missed.length) return 'perfect';
  const tally = {};
  missed.forEach(r => { const th = TC.bank.get(r.id).theme; if (th) tally[th] = (tally[th] || 0) + 1; });
  // most misses wins; on a tie, the theme of the most recent miss wins (so a missed final order card reads as "sequence")
  const top = Math.max(0, ...Object.values(tally));
  if (!top) return 'default';
  const lastTied = missed.map(r => TC.bank.get(r.id).theme).filter(th => th && tally[th] === top).pop();
  return lastTied || THEME_ORDER.find(k => tally[k] === top) || 'default';
}
function endCard(sum){
  const dots = sum.results.map(r => `<i class="${r.correct ? 'ok' : 'no'}"></i>`).join('');
  const aria = sum.results.map((r, i) => `${i + 1}: ${t(r.correct ? 'game.correct' : 'game.notQuite')}`).join(', ');
  return `<div class="endcard">
    <p class="endverdict">${esc(t('verdict.' + verdictKey(sum)))}</p>
    <div class="enddots" role="img" aria-label="${esc(aria)}">${dots}</div>

}

  const grid = `<div class="nav-grid">${ui.navItem({ id:'collection', iconName:'cards', label:t('collection.title') }).replace('</button>', `<span class="s">${have}/${liveIds().length}</span></button>`)}${ui.navItem({ id:'achievements', iconName:'trophy', label:t('ach.title') }).replace('</button>', `<span class="s">${got}/${ACH.length}</span></button>`)}</div>`;
  const cleared = Object.values(p.chapters || {}).some(c => c && c.completed);
  return cleared ? h.replace(/(<button class="nav-item glass" data-action="nav" data-to="sources")/, grid + '$1') : h;
};
/* players who finished chapters before Phase 9 get their earned achievements quietly */
checkAch(true);


/* ================= Phase 10: Daily Choice + share cards ================= */
const DAY = 86400000;
const dayKey = d => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const todayKey = () => dayKey();
const yesterdayKey = () => dayKey(new Date(Date.now() - DAY));
const dayIndex = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); };
/* the same question for everyone on the same day; no repeats until the whole verified pool has been used */
function seededOrder(ids, seed){
  let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
  const a = ids.slice().sort(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
const dailyQid = () => { const pool = seededOrder(liveIds(), 'the-choice-daily'); return pool.length ? pool[dayIndex() % pool.length] : null; };
const dailyState = () => { const d = Object.assign({ streak:0, best:0, last:null, history:{} }, progress().daily || {}); if (d.last !== todayKey() && d.last !== yesterdayKey()) d.streak = 0; return d; };
const playedToday = () => !!dailyState().history[todayKey()];
const isDaily = s => !!s && s.chapterId === 'daily';

/* engine: a timed-out question resolves as a miss without a lock */
TC.engine.Session.prototype.forfeit = function(){
  if (this.s.phase !== 'question') return null;
  const q = this.question, r = { id:q.id, answer:null, correct:false, points:0, parts:[], confidence:'safe', streak:0, timedOut:true };
  this.s.streak = 0; this.s.results[this.s.index] = r; this.s.phase = 'revealed'; this.s.draft = null;
  TC.bus.emit('engine:lock', { session:this, result:r }); return r;
};

/* record the day once */
TC.bus.on('engine:lock', ({ session:s, result:r }) => {
  if (!isDaily(s)) return;
  const p = progress(), d = Object.assign({ streak:0, best:0, last:null, history:{} }, p.daily || {}), today = todayKey();
  if (d.history[today]) return;
  d.streak = d.last === yesterdayKey() ? d.streak + 1 : (d.last === today ? d.streak : 1);
  d.best = Math.max(d.best || 0, d.streak); d.last = today;
  d.history[today] = { qid:r.id, correct:r.correct, points:r.points, timedOut:!!r.timedOut };
  const keys = Object.keys(d.history).sort(); while (keys.length > 60) delete d.history[keys.shift()];
  p.daily = d; saveProgress(p);
});

/* daily runs never touch the saved chapter run */
const saveRunBase = saveRun;
saveRun = function(){ if (isDaily(session)) return; saveRunBase(); };

/* ---- one-minute clock ---- */
let dailyTick = 0;
function stopDailyClock(){ clearInterval(dailyTick); dailyTick = 0; }
function startDailyClock(){
  stopDailyClock();
  const paint = () => {
    const left = Math.max(0, Math.ceil((ui2.dailyEnd - Date.now()) / 1000)), el = document.getElementById('dtimer');
    if (el) { el.textContent = TC.i18n.f('daily.left', { s:left }); el.classList.toggle('urgent', left <= 10); }
    if (left <= 0) { stopDailyClock(); dailyTimeout(); }
    else if (left <= 5) TC.audio.tap();
  };
  paint(); dailyTick = setInterval(paint, 1000);
}
function dailyTimeout(){
  if (!isDaily(session) || session.phase !== 'question') return;
  if (session.canLock()) { ACTIONS.lock(); return; }
  const r = session.forfeit(); if (!r) return;
  ui.toast(t('daily.timeUp')); TC.audio.whoosh();
  ui2.pendingReveal = true; renderGame();
  const dur = verdictFX(r, session);
  setTimeout(() => { ui2.pendingReveal = false; if (current === 'game') renderGame(true); }, Math.max(300, dur - 250));
}
TC.bus.on('engine:lock', ({ session:s }) => { if (isDaily(s)) stopDailyClock(); });

/* header for the daily card: label + clock instead of chapter progress */
const headerP10 = ui.game.header;
ui.game.header = s => {
  if (!isDaily(s)) return headerP10(s);
  let h = headerP10(s);
  const left = Math.max(0, Math.ceil(((ui2.dailyEnd || Date.now()) - Date.now()) / 1000));
  h = h.replace(/<div class="prog"[^>]*>[\s\S]*?<\/div>/, `<div class="dlabel">${icon('calendar')}<span>${esc(t('daily.label'))}</span>${s.phase === 'question' ? `<span class="dtimer${left <= 10 ? ' urgent' : ''}" id="dtimer" role="timer" aria-live="off">${esc(TC.i18n.f('daily.left', { s:left }))}</span>` : ''}</div>`);
  h = h.replace(/(<span class="pips"[^>]*>[^<]*)(?:<i[^>]*><\/i>)+/, `$1<i class="${s.focus ? '' : 'u'}"></i>`);   // the daily card has one Focus point
  return h.replace(/<span class="count"[^>]*>[^<]*<\/span>/, '');
};
/* the daily "next" goes to its result screen */
const nextP10 = ACTIONS.next;
ACTIONS.next = () => { if (isDaily(session)) { stopDailyClock(); go('daily'); return; } nextP10(); };
const leaveP10 = ACTIONS.leave;
ACTIONS.leave = () => {
  if (isDaily(session)) {
    stopDailyClock();
    if (session.phase === 'question') { session.forfeit(); ui.toast(t('daily.leaveForfeit')); }   // the clock keeps running
    TC.audio.tap(); go('menu'); return;
  }
  leaveP10();
};
const afterGameP10 = SCREENS.game.after;
SCREENS.game.after = p => { afterGameP10 && afterGameP10(p); if (isDaily(session) && session.phase === 'question') startDailyClock(); else stopDailyClock(); };
window.addEventListener('hashchange', () => { if (current !== 'game') stopDailyClock(); });

function startDaily(){
  if (playedToday()) { go('daily'); return; }
  const qid = dailyQid(); if (!qid) return;
  session = new TC.engine.Session({ v:2, chapterId:'daily', ids:[qid], index:0, phase:'question', draft:null, results:[], layouts:{},
    score:0, streak:0, bestStreak:0, focus:1, tools:{}, removed:{}, sources:{}, bonus:0 }, TC.bank);
  Object.assign(ui2, { qStart:{}, confidence:'safe', newLedger:[], pendingReveal:false, sourcesOpen:false, srcSeen:{}, newCard:null, stageResolveEarly:false });
  ui2.dailyEnd = Date.now() + 60000;
  TC.audio.chime(); go('game');
}

/* ---- Daily screen ---- */
const untilMidnight = () => { const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const mins = Math.max(1, Math.round((m - n) / 60000)); return (mins >= 60 ? Math.floor(mins / 60) + (TC.i18n.lang === 'he' ? ' ש׳ ' : 'h ') : '') + (mins % 60) + (TC.i18n.lang === 'he' ? ' דק׳' : 'm'); };
SCREENS.daily = {
  dim:true,
  view: () => {
    const d = dailyState(), rec = d.history[todayKey()], q = TC.bank.get(rec ? rec.qid : dailyQid());
    const dateStr = new Date().toLocaleDateString(t('meta.locale'), { weekday:'long', day:'numeric', month:'long' });
    const streak = `<div class="dstreak glass"><span class="flame" aria-hidden="true">${icon('flame')}</span><span><b>${esc(TC.i18n.f('daily.streak', { n:d.streak }))}</b><small>${esc(TC.i18n.f('daily.best', { n:Math.max(d.best || 0, d.streak) }))}</small></span></div>`;
    if (!q) return `<section class="screen">${ui.topbar({ back:true })}<h1 class="h1">${esc(t('daily.title'))}</h1></section>`;
    if (!rec) return `<section class="screen daily" aria-labelledby="d-title">${ui.topbar({ back:true })}
      <div class="dhero"><p class="ddate">${esc(dateStr)}</p><h1 id="d-title" class="h1">${esc(t('daily.title'))}</h1>
      <p class="dlede">${t('daily.lede').split('|').map(x => `<span>${esc(x)}</span>`).join('')}</p></div>
      ${streak}
      <div class="btncol" style="margin-top:22px"><button class="btn btn-orange" data-action="startDaily">${icon('play')} ${esc(t('daily.start'))}</button></div></section>`;
    return `<section class="screen daily" aria-labelledby="d-title">${ui.topbar({ back:true })}
      <div class="dhero"><p class="ddate">${esc(dateStr)}</p><h1 id="d-title" class="h1">${esc(t('daily.title'))}</h1>
      <p class="dresult ${rec.correct ? 'ok' : 'no'}">${rec.correct ? ui.marks.tick : ui.marks.cross}<span>${esc(t(rec.timedOut ? 'daily.timeUp' : rec.correct ? 'daily.right' : 'daily.miss'))}</span><b>${esc(TC.i18n.f('game.pointsLine', { n:rec.points }))}</b></p></div>
      ${streak}
      <div class="card what glass" style="margin-top:14px"><h3>${esc(TC.i18n.tx(q.card.title))} · ${esc(TC.i18n.tx(q.card.date))}</h3><p>${esc(TC.i18n.tx(q.explanation))}</p></div>
      <div class="card dyk glass" style="margin-top:12px"><h3>${esc(t('game.dyk'))}</h3><p>${esc(TC.i18n.tx(q.didYouKnow))}</p></div>
      ${ui.game.sources(q, true)}
      <div class="btncol" style="margin-top:16px"><button class="btn btn-orange" data-action="shareFact" data-id="${q.id}">${icon('share')} ${esc(t('share.fact'))}</button></div>
      <p class="dnext">${esc(TC.i18n.f('daily.next', { t:untilMidnight() }))}</p></section>`;
  }
};
ROUTABLE.push('daily');
Object.assign(ACTIONS, { startDaily: () => startDaily() });

/* menu: Daily Choice is a real, featured destination */
const menuP10 = SCREENS.menu.view;
SCREENS.menu.view = () => {
  const d = dailyState(), done = !!d.history[todayKey()];
  const item = ui.navItem({ id:'daily', iconName:'calendar', label:t('menu.daily'), featured:true })
    .replace('</button>', `<span class="s">${esc(done ? TC.i18n.f('daily.doneSub', { n:d.streak }) : t('daily.menuSub'))}</span></button>`);
  return menuP10().replace(/(<button class="btn btn-primary" data-action="nav" data-to="play">[\s\S]*?<\/button>)/, `$1${item}`);
};

/* ---- share card: a 1080×1350 image of one documented fact ---- */
async function factCard(q){
  try { await Promise.all(['900 120px Heebo', '700 52px Heebo', '400 30px Heebo'].map(f => document.fonts.load(f))); } catch (e) {}
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), rtl = TC.i18n.lang === 'he', F = 'Heebo, system-ui, sans-serif';
  const bg = x.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0B1630'); bg.addColorStop(1, '#05080F'); x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W * .78, H * .2, 20, W * .78, H * .2, 720); glow.addColorStop(0, 'rgba(47,107,255,.34)'); glow.addColorStop(1, 'rgba(47,107,255,0)'); x.fillStyle = glow; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(120,160,230,.06)'; x.lineWidth = 1; for (let i = 0; i <= W; i += 60) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); } for (let j = 0; j <= H; j += 60) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
  /* the game's own coastline, faint, top right */
  const g = TC.ui.geo, pts = str => str.split(' ').map(p => p.split(',').map(Number)), sx = 2.4, ox = W - 330 * sx * .42 - 560, oy = -120;
  x.save(); x.translate(ox, oy); x.scale(sx, sx); x.lineWidth = 1.2 / sx; x.strokeStyle = 'rgba(110,155,220,.35)';
  [g.COAST, g.RED_SEA].forEach(sstr => { x.beginPath(); pts(sstr).forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); });
  x.fillStyle = 'rgba(47,107,255,.10)'; x.beginPath(); pts(g.ISRAEL_AREA).forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill();
  x.fillStyle = 'rgba(63,212,238,.9)'; g.CITIES.forEach(([, a, b]) => { x.beginPath(); x.arc(a, b, 2.2, 0, 7); x.fill(); });
  x.restore();
  /* wordmark (always LTR) */
  const pad = 96; x.direction = 'ltr'; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillStyle = '#8D9AB2'; x.font = `500 30px ${F}`; x.fillText('T  H  E', pad + 4, 168);
  x.font = `900 112px ${F}`; x.fillStyle = '#FFFFFF';
  const ch = 'CH', ice = 'ICE', wCH = x.measureText(ch).width, wO = x.measureText('O').width;
  x.fillText(ch, pad, 270); const ocx = pad + wCH + wO / 2, ocy = 230;
  x.strokeStyle = '#3FD4EE'; x.lineWidth = 10; x.beginPath(); x.ellipse(ocx, ocy, wO * .42, 34, 0, 0, 7); x.stroke();
  x.fillStyle = '#FF9B42'; x.beginPath(); x.arc(ocx, ocy + 2, 9, 0, 7); x.fill();
  x.fillStyle = '#FFFFFF'; x.fillText(ice, pad + wCH + wO, 270);
  /* label + fact */
  x.direction = rtl ? 'rtl' : 'ltr'; x.textAlign = rtl ? 'right' : 'left'; const X = rtl ? W - pad : pad;
  x.fillStyle = '#FF9B42'; x.font = `800 40px ${F}`; x.fillText(t('share.dyk'), X, 440);
  const fact = TC.i18n.tx(q.didYouKnow); let size = 58, lines = [];
  const wrap = (txt, max) => { const out = []; let line = ''; txt.split(/\s+/).forEach(wd => { const tr = line ? line + ' ' + wd : wd; if (x.measureText(tr).width > max && line) { out.push(line); line = wd; } else line = tr; }); if (line) out.push(line); return out; };
  do { x.font = `700 ${size}px ${F}`; lines = wrap(fact, W - pad * 2); size -= 2; } while (lines.length * size * 1.38 > 560 && size > 34);
  x.fillStyle = '#EEF3FA'; lines.forEach((ln, i) => x.fillText(ln, X, 530 + i * (size + 2) * 1.38));
  x.fillStyle = '#3FD4EE'; x.font = `700 32px ${F}`; x.fillText(`${TC.i18n.tx(q.card.title)} · ${TC.i18n.tx(q.card.date)}`, X, 1150);
  x.direction = 'ltr'; x.textAlign = 'center'; x.fillStyle = 'rgba(141,154,178,.9)'; x.font = `500 28px ${F}`;
  x.fillText('THE CHOICE  ·  How much do you really know?', W / 2, H - 112);
  x.fillStyle = 'rgba(92,104,128,.95)'; x.font = `700 22px ${F}`; x.fillText('B Y   M E R E I S I   G R O U P', W / 2, H - 70);
  return new Promise(res => c.toBlob(b => res({ blob:b, url:c.toDataURL('image/png') }), 'image/png'));
}
async function shareFact(id){
  const q = TC.bank.get(id); if (!q) return;
  TC.audio.tap();
  const card = await factCard(q);
  const text = TC.i18n.f('share.factText', { fact:TC.i18n.tx(q.didYouKnow) }), url = shareURL(q.chapter, q.id);
  try {
    const file = new File([card.blob], 'the-choice-fact.png', { type:'image/png' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], text:text + ' ' + url, title:'THE CHOICE' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  /* fallback: show the card, let the player save it, copy the text */
  closeSheet(); sheetReturn = document.activeElement;
  const m = document.createElement('div'); m.className = 'cardsheet'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', t('share.fact'));
  m.innerHTML = `<div class="cs-panel glass"><button class="iconbtn cs-close" data-sheet="close" aria-label="${esc(t('common.close'))}">${icon('x')}</button>
    <h2 class="cs-title" style="margin:2px 0 12px">${esc(t('share.fact'))}</h2>
    <img class="shareimg" src="${card.url}" alt="${esc(text)}">
    <p class="note" style="margin:10px 0 12px">${esc(t('share.saveHint'))}</p>
    <button class="btn btn-ghost" style="width:100%" data-sheet="copy">${esc(t('share.copyText'))}</button></div>`;
  m.addEventListener('click', async e => {
    if (e.target === m || e.target.closest('[data-sheet="close"]')) { closeSheet(); return; }
    if (e.target.closest('[data-sheet="copy"]')) { try { await navigator.clipboard.writeText(text + ' ' + url); ui.toast(t('share.copied')); } catch (er) { ui.toast(text + ' ' + url); } }
  });
  document.body.appendChild(m); document.addEventListener('keydown', sheetKeys, true); m.querySelector('.cs-close').focus();
}
ACTIONS.shareFact = el => { shareFact(el.dataset.id); };
TC.factCard = factCard;

/* "Share this fact" under Did you know? in every reveal */
const revealP10 = ui.game.reveal;
ui.game.reveal = (s, u) => {
  const h = revealP10(s, u); if (!h || !s.result) return h;
  return h.replace(/(<div class="card dyk glass"><h3>[\s\S]*?<\/p>)(<\/div>)/, `$1<button class="sharefact" data-action="shareFact" data-id="${s.question.id}">${icon('share')} ${esc(t('share.fact'))}</button>$2`);
};


/* ================= Phase 11: mobile polish + performance ================= */
/* 1. pause stage loops while the stage is scrolled out of view */
const stageObserver = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('offscreen', !e.isIntersecting)), { threshold:0 }) : null;
function watchStage(){ const st = document.getElementById('stage'); if (stageObserver && st && !st.__watched) { st.__watched = true; stageObserver.observe(st); } }
const afterGameP11 = SCREENS.game.after;
SCREENS.game.after = p => { afterGameP11 && afterGameP11(p); watchStage(); };
const renderGameP11 = renderGame;
renderGame = function(focusReveal){
  renderGameP11(focusReveal); watchStage();
  /* once a reveal has played its entrance, later re-renders (sources, share) must not replay it */
  const sec = app.firstElementChild, key = session ? session.index + ':' + (session.question || {}).id : '';
  if (sec && session && session.phase === 'revealed' && !ui2.pendingReveal) {
    if (ui2.revealSeen === key && !focusReveal) sec.classList.add('settled'); else ui2.revealSeen = key;
  }
};

/* 2. screen classes: background halos only on the lit screens; no pull-to-refresh mid-game */
function screenClasses(){ document.body.classList.toggle('ingame', current === 'game'); }
window.addEventListener('hashchange', () => setTimeout(screenClasses, 0));
const mountP11 = mount;
mount = function(name, p){ mountP11(name, p); screenClasses(); };

/* 3. Android back button during today's choice counts as leaving (no peek-and-retry) */
window.addEventListener('hashchange', () => {
  if (current !== 'game' && isDaily(session) && session.phase === 'question') { stopDailyClock(); session.forfeit(); ui.toast(t('daily.leaveForfeit')); }
});

/* 4. a light tick under the finger on selection (Android) */
document.addEventListener('click', e => {
  if (e.target.closest('[data-action="select"], [data-action="orderTap"], [data-action="confidence"]') && navigator.vibrate) { try { navigator.vibrate(8); } catch (er) {} }
}, true);

/* ---- boot ---- */
let booted = false;
TC.i18n.apply(); TC.motion.apply();
if (TC.motion.mq.addEventListener) TC.motion.mq.addEventListener('change', () => TC.motion.apply());
document.addEventListener('visibilitychange', () => TC.audio.suspend(document.hidden));
mount('loading'); motes();
const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
Promise.all([
  Promise.race([fontsReady.catch(() => {}), new Promise(r => setTimeout(r, 2500))]),
  new Promise(r => setTimeout(r, TC.motion.reduced ? 300 : 1500)),
  TC.content.load()
]).then(() => {
    TC.bank = TC.engine.buildBank(TC.content.all());          // build the bank from the loaded chapters
    checkAch(true);
    renderBackground(TC.motion.reduced);
    requestAnimationFrame(() => document.getElementById('bgmap').classList.add('on'));
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);   // drop stale #/routes from a previous visit
    if (!deepLink()) mount('intro', { fast:TC.motion.reduced, quick:!!(TC.storage.getSection('progress') || {}).introSeen });
  }, err => {
    console.error('[content] load failed:', err);                // never boot a blank game
    const line = app.querySelector('.dots'); if (line) line.textContent = t('common.loadError');
    ui.toast(t('common.loadError'));
  });
})(window.TC);
