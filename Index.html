<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A13">
<meta name="color-scheme" content="dark">
<title>THE CHOICE — How much do you really know?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<!--
  THE CHOICE — Phase 5: scoring · streaks · Focus
  Single-file build. Sections:
    <style>               design system (tokens · atmosphere · components · screens)
    script#tc-i18n        translation objects + chapter metadata (content only)
    script#tc-lib         core: event bus · storage · localization · motion · audio · icons
    script#tc-schema      question format (documented) + validator
    script#tc-content-*   question content, one block per chapter (data only, never inside components)
    script#tc-engine      game engine: validation · question bank · session state machine (no DOM)
    script#tc-ui          presentation: map · logo · reusable components · game components
    script#tc-app         screens · router · boot
-->
<style>
/* =================== TOKENS =================== */
:root{
  --bg:#060A13; --bg-2:#0A1426; --navy:#0F1E36;
  --glass:rgba(16,30,54,.58); --glass-solid:#0F1B30;
  --line:rgba(140,170,220,.14); --line-2:rgba(140,170,220,.28);
  --text:#EEF3FA; --text-2:#C6D2E6; --mute:#8D9AB2; --dim:#5C6880;
  --blue:#2F6BFF; --blue-2:#5B8CFF; --cyan:#3FD4EE; --orange:#FF9B42; --red:#FF5B61; --green:#3DDC97;
  --glow-cyan:rgba(63,212,238,.35); --glow-blue:rgba(47,107,255,.55);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --tap:56px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* The game is dark by design; tokens are pinned for every viewer theme. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#060A13; --text:#EEF3FA; } }
:root[data-theme="dark"]{ --bg:#060A13; --text:#EEF3FA; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; border-radius:10px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
[dir="rtl"] .flip{ transform:scaleX(-1); }

/* =================== ATMOSPHERE =================== */
#bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#bgmap{ position:absolute; inset:-4%; opacity:0; transition:opacity 2.2s var(--ease); }
#bgmap.on{ opacity:.75; }
#bgmap svg{ width:100%; height:100%; display:block; animation:drift 48s ease-in-out infinite alternate; transform-origin:60% 45%; }
@keyframes drift{ from{ transform:scale(1) translate(0,0) } to{ transform:scale(1.06) translate(-1.2%,.8%) } }
.dim #bgmap.on{ opacity:.22; }
#vignette{ position:absolute; inset:0;
  background:radial-gradient(min(300px,48vw) 46% at 50% 42%,rgba(6,10,19,.62),transparent 100%),
             radial-gradient(110% 75% at 50% 42%,transparent 0%,rgba(6,10,19,.5) 58%,var(--bg) 100%),
             linear-gradient(180deg,rgba(6,10,19,.15),rgba(6,10,19,.7)); }
.motes i{ position:absolute; bottom:-10px; width:2px; height:2px; border-radius:50%; background:var(--cyan); opacity:0; animation:mote linear infinite; }
@keyframes mote{ 0%{ transform:translateY(0); opacity:0 } 15%{ opacity:.45 } 85%{ opacity:.25 } 100%{ transform:translateY(-105vh); opacity:0 } }

#app{ position:relative; z-index:2; min-height:100%; display:flex; justify-content:center; }
.screen{ width:100%; max-width:560px; min-height:100%; padding:12px 18px 28px; display:flex; flex-direction:column; animation:screenIn .5s var(--ease) both; }
@keyframes screenIn{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }

/* =================== MAP =================== */
.map .sea{ fill:#071224; }
.map .land{ fill:#0D1A2E; }
.map .grid line{ stroke:rgba(90,130,200,.06); stroke-width:.6; }
.map .coast{ fill:none; stroke:rgba(110,155,220,.38); stroke-width:.9; }
.map .border{ fill:none; stroke:rgba(120,160,220,.2); stroke-width:.7; stroke-dasharray:3 3; }
.map .terr{ fill:rgba(47,107,255,.07); stroke:rgba(91,140,255,.3); stroke-width:.8; }
.map .lbl{ fill:rgba(150,178,222,.32); font:600 8px var(--font); letter-spacing:.2em; text-transform:uppercase; }
.map .lbl.sea{ fill:rgba(90,140,220,.28); font-style:italic; }
.map .city{ opacity:0; }
.map.lit .city{ animation:cityOn 1s var(--ease) forwards; }
@keyframes cityOn{ 0%{opacity:0} 35%{opacity:1} 55%{opacity:.5} 100%{opacity:1} }
.map .city .c{ fill:var(--cyan); }
.map .city .h{ fill:var(--cyan); opacity:.22; transform-box:fill-box; transform-origin:center; animation:halo 3.4s ease-in-out infinite; }
@keyframes halo{ 0%,100%{ transform:scale(1); opacity:.22 } 50%{ transform:scale(2.4); opacity:0 } }
.map .city text{ fill:rgba(200,220,245,.38); font:500 7px var(--font); }

/* =================== BRAND =================== */
.logo{ display:flex; flex-direction:column; align-items:center; font-weight:900; line-height:.9; letter-spacing:.14em; text-transform:uppercase; direction:ltr; }
.logo .the{ font-size:.3em; font-weight:500; letter-spacing:.95em; margin-inline-start:.95em; color:var(--mute); margin-bottom:.38em; }
.logo .word{ background:linear-gradient(180deg,#fff 0%,#C3D4F1 68%,#7E96C1 100%); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
.logo .o{ position:relative; display:inline-block; color:transparent; }
.logo .o::after{ content:""; position:absolute; inset:.17em .07em .1em; border-radius:50%; border:.085em solid var(--cyan); box-shadow:0 0 .22em var(--glow-cyan), inset 0 0 .14em var(--glow-cyan); }
.logo .o::before{ content:""; position:absolute; left:50%; top:calc(50% + .035em); width:.13em; height:.13em; margin:-.065em 0 0 -.065em; border-radius:50%; background:var(--orange); box-shadow:0 0 .28em var(--orange); }
.tagline{ margin:0; color:var(--mute); font-weight:300; letter-spacing:.02em; }

/* =================== COMPONENTS =================== */
.btn{ display:flex; align-items:center; justify-content:center; gap:10px; min-height:var(--tap); padding:0 22px; border-radius:var(--r-md); font-weight:800; font-size:15px; letter-spacing:.14em; text-transform:uppercase; position:relative; overflow:hidden; transition:transform .15s var(--ease), box-shadow .25s, background .25s; }
.btn:active{ transform:scale(.97); }
.btn svg{ width:20px; height:20px; flex:none; }
.btn-primary{ color:#fff; background:linear-gradient(180deg,#3C79FF,#2453D6); box-shadow:0 12px 32px -12px var(--glow-blue), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-primary::after{ content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%); transform:translateX(-100%); animation:sheen 4s ease-in-out infinite 1.5s; }
@keyframes sheen{ 0%{ transform:translateX(-100%) } 35%,100%{ transform:translateX(100%) } }
.btn-ghost{ background:rgba(255,255,255,.04); border:1px solid var(--line-2); }
[dir="rtl"] .btn, [dir="rtl"] .eyebrow, [dir="rtl"] .h1, [dir="rtl"] .nav-item .t{ letter-spacing:.02em; }

.iconbtn{ width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--text-2); }
.iconbtn svg{ width:20px; height:20px; }

.seg{ display:inline-flex; gap:4px; padding:4px; border-radius:999px; border:1px solid var(--line-2); background:rgba(6,10,19,.55); }
.seg button{ min-height:40px; min-width:62px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:700; color:var(--mute); transition:background .2s, color .2s; }
.seg button[aria-pressed="true"]{ background:var(--text); color:var(--bg); }

.switch{ width:56px; height:32px; flex:none; border-radius:999px; background:rgba(255,255,255,.12); position:relative; transition:background .2s; }
.switch::after{ content:""; position:absolute; top:3px; inset-inline-start:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:inset-inline-start .2s var(--ease); box-shadow:0 2px 6px rgba(0,0,0,.4); }
.switch[aria-checked="true"]{ background:var(--blue); }
.switch[aria-checked="true"]::after{ inset-inline-start:27px; }

.glass{ background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }

.topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px; }
.topbar .mark{ font-size:14px; font-weight:900; letter-spacing:.22em; color:var(--text-2); direction:ltr; }

.h1{ margin:8px 0 6px; font-size:28px; font-weight:900; letter-spacing:.05em; text-transform:uppercase; }
.lede{ margin:0 0 20px; color:var(--mute); font-size:15px; line-height:1.55; max-width:44ch; }
.pill{ flex:none; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; padding:4px 9px; border-radius:999px; color:var(--mute); border:1px solid var(--line-2); display:inline-flex; align-items:center; gap:5px; }
.pill svg{ width:11px; height:11px; }

.toast{ position:fixed; z-index:60; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(92vw,420px); padding:14px 16px; border-radius:var(--r-md); background:rgba(15,27,48,.96); border:1px solid var(--line-2); box-shadow:0 20px 40px -12px rgba(0,0,0,.7); font-size:14px; line-height:1.45; color:var(--text-2); display:flex; gap:12px; align-items:center; animation:toast 3.2s var(--ease) forwards; }
.toast svg{ width:18px; height:18px; color:var(--orange); flex:none; }
@keyframes toast{ 0%{ opacity:0; transform:translate(-50%,16px) } 10%,85%{ opacity:1; transform:translate(-50%,0) } 100%{ opacity:0; transform:translate(-50%,8px) } }

/* =================== LOADING / INTRO =================== */
.stagecenter{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px; padding:24px 0; }
.loading .logo{ font-size:clamp(40px,12vw,58px); }
.dots{ margin-top:8px; font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan); opacity:.85; }
[dir="rtl"] .dots{ letter-spacing:.05em; }
.dots::after{ content:""; display:block; height:1px; width:0; margin:14px auto 0; background:linear-gradient(90deg,transparent,var(--cyan),transparent); animation:grow 1.6s var(--ease) forwards; }
@keyframes grow{ to{ width:180px } }

.intro{ position:relative; }
.intro .skip{ position:absolute; top:6px; inset-inline-end:6px; min-height:44px; padding:0 12px; border-radius:10px; font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); z-index:2; }
.intro .stagecenter{ padding-top:56px; }
.intro .logo{ font-size:clamp(46px,15.5vw,84px); }
.intro .reveal{ opacity:0; animation:fadeUp 1.1s var(--ease) forwards; }
.intro .tagline{ font-size:17px; }
.intro .poem{ margin:6px 0 0; font-size:19px; line-height:1.6; font-weight:300; color:var(--text-2); }
.intro .poem span{ display:block; }
.intro .poem b{ font-weight:800; color:#fff; }
.intro .cta{ width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:10px; }
.intro .cta .btn{ width:100%; }
.intro.fast .reveal{ animation-delay:0s !important; animation-duration:.35s !important; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }

/* =================== MENU =================== */
.menu-hero{ flex:1; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:2vh 0 3vh; }
.menu-hero .logo{ font-size:clamp(42px,13vw,66px); }
.nav{ display:flex; flex-direction:column; gap:10px; }
.nav .btn-primary{ min-height:64px; font-size:17px; }
.nav-item{ display:flex; align-items:center; gap:14px; min-height:var(--tap); padding:0 16px; border-radius:var(--r-md); text-align:start; transition:transform .15s var(--ease), border-color .2s; }
.nav-item:active{ transform:scale(.98); }
.nav-item .ic{ width:22px; height:22px; flex:none; color:var(--blue-2); }
.nav-item .t{ flex:1; font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
.nav-item .s{ font-size:12px; color:var(--mute); }
.nav-item[aria-disabled="true"]{ cursor:default; }
.nav-item[aria-disabled="true"] .ic, .nav-item[aria-disabled="true"] .t{ opacity:.55; }
.nav-item.featured{ border-color:rgba(255,155,66,.35); background:linear-gradient(90deg,rgba(255,155,66,.12),rgba(16,30,54,.55)); }
[dir="rtl"] .nav-item.featured{ background:linear-gradient(270deg,rgba(255,155,66,.12),rgba(16,30,54,.55)); }
.nav-item.featured .ic{ color:var(--orange); }
.nav-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.nav-grid .nav-item{ flex-wrap:wrap; align-content:center; gap:4px 12px; padding:12px 14px; min-height:76px; }
.nav-grid .nav-item .t{ font-size:12px; letter-spacing:.1em; flex-basis:calc(100% - 40px); }
.nav-grid .nav-item .pill{ margin-inline-start:34px; }

/* =================== CHAPTERS =================== */
.chapters{ display:flex; flex-direction:column; gap:12px; }
.chap{ position:relative; overflow:hidden; display:grid; grid-template-columns:52px 1fr; align-items:center; gap:14px; min-height:104px; padding:18px; border-radius:var(--r-lg); text-align:start; background:linear-gradient(120deg,rgba(16,30,54,.86),rgba(9,17,31,.72)); border:1px solid var(--line); }
.chap::before{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(70% 130% at 100% 0%,var(--tint),transparent 70%); }
[dir="rtl"] .chap::before{ background:radial-gradient(70% 130% at 0% 0%,var(--tint),transparent 70%); }
.chap .num{ font-size:34px; font-weight:900; color:transparent; -webkit-text-stroke:1px rgba(150,180,230,.55); font-variant-numeric:tabular-nums; direction:ltr; }
.chap .nm{ display:block; font-size:18px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
.chap .ds{ display:block; margin-top:4px; font-size:13.5px; line-height:1.45; color:var(--mute); }
.chap .pill{ position:relative; margin-top:10px; }
[dir="rtl"] .chap .nm{ letter-spacing:.02em; }

/* =================== SETTINGS =================== */
.rows{ border-radius:var(--r-lg); overflow:hidden; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:72px; padding:14px 16px; border-bottom:1px solid var(--line); }
.row:last-child{ border-bottom:0; }
.row b{ display:block; font-size:15px; font-weight:700; }
.row p{ margin:3px 0 0; font-size:12.5px; color:var(--mute); }
.row.stack{ flex-direction:column; align-items:stretch; }
.row.stack .seg{ align-self:flex-start; }
.footnote{ margin:14px 2px 0; font-size:12px; color:var(--dim); }

/* =================== MOTION =================== */
.reduce *, .reduce *::before, .reduce *::after{ animation-duration:.01ms !important; animation-delay:0ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
.reduce .motes{ display:none; }

@media (min-width:760px){
  #bgmap{ inset:auto; left:50%; top:50%; width:min(118vh,100vw); height:118vh; transform:translate(-50%,-50%); -webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%); mask-image:radial-gradient(closest-side,#000 62%,transparent 100%); }
  .screen{ padding-top:24px; }
  .menu-hero{ padding:6vh 0 4vh; }
}
@media (max-height:640px){
  .intro .poem{ font-size:17px; }
  .menu-hero{ min-height:170px; }
}

/* =================== GAME (Phase 2: engine-driven loop) =================== */
.screen.static{ animation:none; }
.ghead{ display:flex; align-items:center; gap:12px; min-height:56px; }
.ghead .prog{ flex:1; display:flex; gap:5px; }
.ghead .prog i{ flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.1); }
.ghead .prog i.ok{ background:var(--green); }
.ghead .prog i.no{ background:var(--orange); }
.ghead .prog i.now{ background:var(--cyan); box-shadow:0 0 10px var(--glow-cyan); }
.ghead .count{ font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
.eyebrow{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:8px 0 14px; font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); }
.eyebrow .yr{ color:#fff; font-size:13px; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
.eyebrow .d{ color:var(--mute); font-weight:600; letter-spacing:.14em; }
.situation{ margin:0 0 14px; font-size:19px; line-height:1.5; font-weight:500; }
.ctx{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:8px; }
.ctx li{ padding:10px 12px; border-radius:var(--r-sm); background:rgba(255,255,255,.03); border-inline-start:2px solid var(--blue-2); font-size:14.5px; line-height:1.5; color:var(--text-2); }
.qtext{ margin:0 0 12px; font-size:18px; line-height:1.4; font-weight:800; }
.qlabel{ margin:0 0 8px; font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); }
.statement{ margin:0 0 14px; padding:16px; border-radius:var(--r-md); font-size:17.5px; line-height:1.5; font-weight:600; background:linear-gradient(180deg,rgba(63,212,238,.08),rgba(63,212,238,.02)); border:1px solid rgba(63,212,238,.28); }
.answers{ display:flex; flex-direction:column; gap:10px; }
.answers.binary{ display:grid; grid-template-columns:1fr 1fr; }
.ans{ display:flex; align-items:center; gap:14px; min-height:var(--tap); padding:12px 14px; border-radius:var(--r-md); text-align:start; font-size:15.5px; line-height:1.4; font-weight:500; background:rgba(16,28,49,.85); border:1px solid var(--line-2); transition:border-color .2s, background .2s, transform .2s var(--ease); }
.ans .k{ flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:9px; font-size:13px; font-weight:900; background:rgba(255,255,255,.06); color:var(--mute); }
.ans .lbl{ flex:1; }
.ans .tag{ display:flex; margin-top:6px; align-items:center; gap:4px; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.ans .tag svg{ width:14px; height:14px; }
.binary .ans{ justify-content:center; flex-direction:column; gap:6px; min-height:76px; font-size:16px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; text-align:center; }
.binary .ans .lbl{ flex:none; display:flex; flex-direction:column; align-items:center; }
.verdict:focus{ outline:none; }
.ans[aria-pressed="true"]{ border-color:var(--orange); background:rgba(255,155,66,.12); }
.ans[aria-pressed="true"] .k{ background:var(--orange); color:#1A0E02; }
.answers.done .ans{ cursor:default; }
.ans.is-right{ border-color:var(--green); background:rgba(61,220,151,.12); }
.ans.is-right .k{ background:var(--green); color:#04140C; } .ans.is-right .tag{ color:var(--green); }
.ans.is-wrong{ border-color:var(--orange); background:rgba(255,155,66,.08); }
.ans.is-wrong .k{ background:var(--orange); color:#1A0E02; } .ans.is-wrong .tag{ color:var(--orange); }
.answers.done .ans:not(.is-right):not(.is-wrong){ opacity:.45; }
.actionbar{ position:sticky; bottom:0; z-index:5; margin-top:auto; padding:16px 0 calc(4px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,transparent,var(--bg) 35%); }
.gamebody{ display:flex; flex-direction:column; flex:1; }
.btn[disabled]{ opacity:.38; cursor:not-allowed; box-shadow:none; }
.btn[disabled]::after{ display:none; }
.reveal{ display:flex; flex-direction:column; gap:12px; margin-top:18px; scroll-margin-top:12px; }
.verdict{ display:flex; align-items:center; gap:12px; margin:0; font-size:30px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; animation:screenIn .5s var(--ease) both; }
.verdict svg{ width:30px; height:30px; flex:none; padding:5px; border-radius:50%; }
.verdict.ok svg{ color:#04140C; background:var(--green); box-shadow:0 0 22px rgba(61,220,151,.5); }
.verdict.no svg{ color:#1A0E02; background:var(--orange); }
[dir="rtl"] .verdict{ letter-spacing:.01em; }
.card{ padding:16px; border-radius:var(--r-lg); animation:screenIn .5s var(--ease) both; }
.card h3{ margin:0 0 8px; font-size:12px; font-weight:900; letter-spacing:.2em; text-transform:uppercase; }
.card p{ margin:0; font-size:15.5px; line-height:1.6; color:var(--text-2); }
.card .note{ margin-top:10px; font-size:12.5px; color:var(--mute); line-height:1.5; }
.card.what h3{ color:var(--cyan); }
.card.dyk{ background:linear-gradient(135deg,rgba(255,155,66,.12),rgba(16,30,54,.6)); border-color:rgba(255,155,66,.3); animation-delay:.12s; }
.card.dyk h3{ color:var(--orange); }
.card.src{ animation-delay:.24s; }

.persp{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 18px; }

.ci-types{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
.ci-types li{ padding:6px 10px; border-radius:8px; background:rgba(255,255,255,.05); font-size:12px; font-weight:600; color:var(--mute); }
[dir="rtl"] .ci-kicker, [dir="rtl"] .ci-name{ letter-spacing:.01em; }
.chapintro .actionbar{ margin-top:16px; }
.coach{ display:flex; gap:10px; align-items:flex-start; margin:0 0 12px; padding:10px 12px; border-radius:var(--r-sm); border:1px dashed rgba(63,212,238,.4); color:var(--text-2); font-size:13.5px; line-height:1.45; }
.coach svg{ width:18px; height:18px; flex:none; color:var(--cyan); margin-top:1px; }
.nav-item.continue{ border-color:rgba(63,212,238,.4); }
.nav-item.continue .ic{ color:var(--cyan); }
.chap .pill.done{ color:var(--green); border-color:rgba(61,220,151,.45); }
.resbadge{ text-align:center; margin:0 0 4px; }
.resbadge .badge{ display:inline-block; padding:5px 12px; border-radius:999px; font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--orange); background:rgba(255,155,66,.14); }
.statrow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 0; }
.stat{ padding:14px; border-radius:var(--r-md); text-align:center; }

.stat span{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.results .hint{ margin:-2px 0 10px; font-size:13px; color:var(--mute); }
.results .rlist li{ display:block; padding:0; }
.results details{ border-radius:var(--r-md); }

.results summary::after{ content:""; margin-inline-start:auto; flex:none; width:8px; height:8px; border-right:2px solid var(--mute); border-bottom:2px solid var(--mute); transform:rotate(45deg); transition:transform .2s; }
.results details[open] summary::after{ transform:rotate(-135deg); }
.results details svg{ width:18px; height:18px; flex:none; }
.results details.ok svg{ color:var(--green); } .results details.no svg{ color:var(--orange); }
.results .rq{ display:flex; gap:8px; }
.results .rn{ color:var(--dim); font-variant-numeric:tabular-nums; }
.results details p{ margin:0; padding:0 14px 14px; font-size:14px; line-height:1.6; color:var(--text-2); }
.nextsoon{ display:flex; align-items:center; gap:10px; padding:14px; border-radius:var(--r-md); font-size:13.5px; color:var(--mute); line-height:1.4; }
.btngrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
[dir="rtl"] .stat span, [dir="rtl"] .resbadge .badge{ letter-spacing:0; }

/* =================== SCORING · STREAKS · FOCUS (Phase 5) =================== */
.runscore{ display:flex; align-items:baseline; gap:6px; padding:6px 12px; border-radius:999px; background:rgba(63,212,238,.08); border:1px solid rgba(63,212,238,.28); font-weight:900; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; transition:transform .25s var(--ease), box-shadow .25s; }
.runscore small{ font-size:9.5px; font-weight:700; letter-spacing:.16em; color:var(--mute); text-transform:uppercase; }
.runscore.bump{ transform:scale(1.12); box-shadow:0 0 22px var(--glow-cyan); }
.gmeta{ display:flex; align-items:center; gap:12px; min-height:26px; margin-top:2px; }
.pips{ display:flex; align-items:center; gap:5px; font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); }
.pips i{ width:9px; height:9px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px rgba(255,155,66,.45); }
.pips i.u{ background:rgba(255,255,255,.12); box-shadow:none; }
.tier{ font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--orange); animation:tierIn .5s var(--ease); }
.tier.momentum{ color:#FFC36B; } .tier.historian{ color:var(--cyan); text-shadow:0 0 12px var(--glow-cyan); }
@keyframes tierIn{ from{ opacity:0; transform:scale(1.3) } }
.gmeta .count{ margin-inline-start:auto; font-size:12px; font-weight:800; color:var(--mute); font-variant-numeric:tabular-nums; }
.fastbar{ position:relative; height:3px; margin:-6px 0 14px; border-radius:3px; background:rgba(255,255,255,.07); overflow:hidden; }
.fastbar i{ position:absolute; inset:0; background:linear-gradient(90deg,var(--cyan),var(--blue-2)); transform-origin:left; animation:drain linear forwards; }
[dir="rtl"] .fastbar i{ transform-origin:right; }
.fastbar.urgent i{ background:linear-gradient(90deg,var(--orange),#FFC36B); }
@keyframes drain{ from{ transform:scaleX(1) } to{ transform:scaleX(0) } }
.fastlbl{ display:block; margin:-10px 0 12px; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
.tools{ display:flex; gap:8px; margin-top:12px; }
.tool{ flex:1; min-height:46px; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 8px; border-radius:12px; border:1px solid rgba(255,155,66,.32); background:rgba(255,155,66,.06); color:#FFC48D; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
.tool svg{ width:16px; height:16px; flex:none; }
.tool[disabled]{ opacity:.3; cursor:not-allowed; }
.clue{ display:flex; gap:10px; margin:12px 0 0; padding:12px 14px; border-radius:var(--r-md); border:1px dashed rgba(255,155,66,.5); color:#FFD6AE; font-size:14px; line-height:1.45; animation:screenIn .4s var(--ease) both; }

.ans.ord.anchored .k{ background:var(--orange); color:#1A0E02; border:0; }
.choosehint{ margin:0; text-align:center; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); padding:14px 0 4px; }
.lockpanel{ display:flex; flex-direction:column; gap:10px; animation:slideUp .35s var(--ease) both; }
@keyframes slideUp{ from{ opacity:0; transform:translateY(18px) } to{ opacity:1; transform:none } }
.conf{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px; border-radius:14px; border:1px solid var(--line-2); background:rgba(6,10,19,.7); }
.conf button{ min-height:42px; border-radius:10px; font-size:12.5px; font-weight:800; color:var(--mute); letter-spacing:.04em; }
.conf button[aria-pressed="true"]{ background:rgba(255,255,255,.92); color:var(--bg); }
.conf button.sure[aria-pressed="true"]{ background:linear-gradient(180deg,#FFB36B,#F07F1F); color:#1A0E02; box-shadow:0 0 18px rgba(255,155,66,.45); }
.confnote{ margin:0; text-align:center; font-size:11.5px; color:var(--mute); }
/* verdict moment */
.vfx{ position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; }
.vfx::before{ content:""; position:absolute; inset:0; animation:vflash 1.3s ease-out forwards; }
.vfx.ok::before{ background:radial-gradient(circle at 50% 46%,rgba(22,70,52,.92),rgba(6,10,19,.9) 62%); }
.vfx.no::before{ background:radial-gradient(circle at 50% 46%,rgba(70,42,16,.92),rgba(6,10,19,.9) 62%); }

.vfx .vw{ font-size:clamp(44px,14vw,76px); font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#fff; line-height:1; }
.vfx.ok .vw{ text-shadow:0 0 40px rgba(61,220,151,.75); } .vfx.no .vw{ text-shadow:0 0 36px rgba(255,155,66,.6); }
.vfx .vp{ margin-top:10px; font-size:30px; font-weight:900; color:var(--green); font-variant-numeric:tabular-nums; }
.vfx.no .vp{ color:var(--orange); }
.vfx .vs{ margin-top:8px; font-size:12px; color:var(--text-2); letter-spacing:.08em; }
.vfx .vt{ margin-top:12px; font-size:14px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:var(--orange); }
@keyframes vflash{ 0%{ opacity:0 } 12%{ opacity:1 } 75%{ opacity:1 } 100%{ opacity:0 } }
@keyframes vpop{ 0%{ opacity:0; transform:scale(1.35) } 16%{ opacity:1; transform:scale(1) } 78%{ opacity:1 } 100%{ opacity:0; transform:scale(.96) } }
[dir="rtl"] .vfx .vw, [dir="rtl"] .vfx .vt{ letter-spacing:.01em; }
.ptsline{ margin:-4px 0 0; font-size:13px; color:var(--mute); line-height:1.5; }
.ptsline b{ color:var(--green); font-size:15px; } .ptsline b.neg{ color:var(--orange); }
.card.ledger{ background:linear-gradient(135deg,rgba(47,107,255,.16),rgba(16,30,54,.6)); border-color:rgba(91,140,255,.35); animation-delay:.18s; }
.card.ledger h3{ color:var(--blue-2); display:flex; align-items:center; gap:8px; }
.card.ledger ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.card.ledger li{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; }
.card.ledger .lv{ min-width:74px; padding:8px 10px; border-radius:10px; background:rgba(6,10,19,.55); text-align:center; font-weight:900; font-size:15px; color:#fff; font-variant-numeric:tabular-nums; }
.card.ledger .ll{ font-size:14px; line-height:1.45; color:var(--text-2); }
.card.ledger .ll a{ display:block; margin-top:3px; font-size:11.5px; color:var(--dim); }
.card.ledger .new{ font-size:9.5px; padding:3px 7px; border-radius:6px; background:rgba(91,140,255,.22); color:#BFD0FF; letter-spacing:.12em; }
.menustats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 12px; }
.menustats div{ padding:10px 8px; border-radius:var(--r-md); text-align:center; }
.menustats b{ display:block; font-size:19px; font-weight:900; font-variant-numeric:tabular-nums; }
.menustats span{ font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.results .stats4{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 0; }
.results .bonusline{ margin:8px 0 0; text-align:center; font-size:12.5px; font-weight:700; color:var(--orange); }
/* chapter title card: content then button, no dead gap */
.ci-hero{ flex:none; justify-content:flex-start; padding:9vh 0 0; }
.chapintro .actionbar{ position:static; background:none; margin-top:30px; }
[dir="rtl"] .pips, [dir="rtl"] .tier, [dir="rtl"] .tool, [dir="rtl"] .choosehint, [dir="rtl"] .fastlbl, [dir="rtl"] .menustats span, [dir="rtl"] .runscore small, [dir="rtl"] .card.ledger .new{ letter-spacing:0; }

<script id="tc-lib">
(function(TC){
'use strict';

/* ---- event bus ---- */
const listeners = {};
TC.bus = {
  on(evt, fn){ (listeners[evt] = listeners[evt] || []).push(fn); },
  emit(evt, data){ (listeners[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); }
};

/* ---- content registry: each tc-content-* block calls TC.content.add(chapterId, [...]) ---- */
const contentList = [];
TC.content = {
  add(chapterId, questions){ (questions || []).forEach(q => { if (q && !q.chapter) q.chapter = chapterId; contentList.push(q); }); },
  all(){ return contentList.slice(); }
};

/* ---- storage: one versioned record, namespaced sections ----
   Phase 1 persists prefs only. Future sections (progress, score, streak,
   achievements, collection, daily) slot in beside `prefs` without migration
   of existing data; swap read/write for a backend later.                    */
TC.storage = (function(){
  const KEY = 'thechoice:v1';
  const DEFAULTS = { version:1, prefs:{ lang:'en', sound:true, motion:'system' } };
  let mem = null;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function read(){
    if (mem) return mem;
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    mem = clone(DEFAULTS);
    if (raw && typeof raw === 'object') {
      const p = raw.prefs || {};
      if (p.lang === 'en' || p.lang === 'he') mem.prefs.lang = p.lang;
      if (typeof p.sound === 'boolean') mem.prefs.sound = p.sound;
      if (['system','full','reduced'].includes(p.motion)) mem.prefs.motion = p.motion;
      if (raw.run && typeof raw.run === 'object') mem.run = raw.run;
    }
    return mem;
  }
  function write(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* private mode: keep in memory */ } }
  return {
    getPref(k){ return read().prefs[k]; },
    setPref(k, v){ read().prefs[k] = v; write(); TC.bus.emit('pref', { key:k, value:v }); },
    /* sections: run (Phase 2); progress, score, achievements, collection, daily later */
    getSection(name){ const v = read()[name]; return v == null ? null : JSON.parse(JSON.stringify(v)); },
    setSection(name, v){ const m = read(); if (v == null) delete m[name]; else m[name] = v; write(); }
  };
})();

/* ---- localization ---- */
TC.i18n = {
  get lang(){ return TC.storage.getPref('lang'); },
  t(path){
    const pick = dict => path.split('.').reduce((o, k) => (o && o[k] !== undefined) ? o[k] : undefined, dict);
    const v = pick(TC.STRINGS[this.lang]);
    if (v !== undefined) return v;
    const fb = pick(TC.STRINGS.en);
    if (fb === undefined) console.warn('[i18n] missing key', path);
    return fb !== undefined ? fb : path;
  },
  tx(obj){ return obj ? (obj[this.lang] || obj.en || '') : ''; },
  f(path, vars){ return String(this.t(path)).replace(/\{(\w+)\}/g, (m, k) => vars && vars[k] != null ? vars[k] : m); },
  apply(){
    const l = this.lang, root = document.documentElement;
    root.lang = l; root.dir = l === 'he' ? 'rtl' : 'ltr';
    document.title = this.t('meta.title');
  },
  set(l){ if (l === this.lang) return; TC.storage.setPref('lang', l); this.apply(); TC.bus.emit('lang', l); }
};

/* ---- motion ---- */
TC.motion = {
  mq: window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches:false },
  get reduced(){ const m = TC.storage.getPref('motion'); return m === 'reduced' || (m === 'system' && this.mq.matches); },
  apply(){ document.documentElement.classList.toggle('reduce', this.reduced); }
};

/* ---- audio: synthesized, no assets; starts only after a user gesture ---- */
TC.audio = (function(){
  let ctx = null, master = null, bed = null, noise = null, pulseTimer = null;
  const on = () => TC.storage.getPref('sound');
  function ensure(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return !!ctx; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = on() ? .8 : 0; master.connect(ctx.destination);
      const n = ctx.sampleRate * .6; noise = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return !!ctx;
  }
  function note(f, at, dur, type, vol){
    if (!ctx) return; const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  }
  function thump(){
    if (!ctx) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(68, t); o.frequency.exponentialRampToValueAtTime(38, t + .4);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .55);
  }
  return {
    unlock(){ if (ensure()) this.atmosphere(); },
    atmosphere(){
      if (!ctx || bed) return;
      const g = ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(.055, ctx.currentTime + 5);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 2.5;
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .06; lg.gain.value = 170; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      [[55,'sine',1],[82.41,'sine',.6],[110.2,'triangle',.22],[164.8,'sine',.1]].forEach(([fr, ty, v]) => { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = ty; o.frequency.value = fr; og.gain.value = v; o.connect(og); og.connect(f); o.start(); });
      f.connect(g); g.connect(master); bed = g;
      clearInterval(pulseTimer); pulseTimer = setInterval(thump, 2800);
    },
    setEnabled(v){ if (master) master.gain.setTargetAtTime(v ? .8 : 0, ctx.currentTime, .15); },
    tap(){ note(880, 0, .06, 'sine', .035); },
    whoosh(){
      if (!ctx || !noise) return; const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2200, t + .45);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + .18); g.gain.linearRampToValueAtTime(0, t + .5);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + .55);
    },
    chime(){ [392, 523.25, 659.25].forEach((f, i) => note(f, i * .08, 1.1, 'sine', .07)); },
    suspend(v){ if (ctx) v ? ctx.suspend() : ctx.resume(); }
  };
})();
TC.bus.on('pref', p => { if (p.key === 'sound') TC.audio.setEnabled(p.value); if (p.key === 'motion') TC.motion.apply(); });

/* ---- icons (Lucide-style strokes, inline) ---- */
const P = {
  play:'<polygon points="7 4 20 12 7 20 7 4"/>',

  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',

  volume:'<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  mute:'<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6M17 9l6 6"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  check:'<path d="M20 6 9 17l-5-5"/>'
};
TC.icon = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[name] || ''}</svg>`;
TC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
})(window.TC);

<script id="tc-schema">
(function(TC){

/* QUESTION FORMAT (one object per question; add to any tc-content-* block)

    else {
      const ids = a.map(x => x.id);

<!-- ================= ENGINE: pure game logic, no DOM ================= -->
<script id="tc-engine">
(function(TC){
'use strict';
const { FAMILY, BINARY } = TC.schema;
/* Evaluation: every type is either picked (one id) or sequenced (ordered ids).
   New types only need a schema family + a renderer — the session never changes. */
const kindOf = q => FAMILY(q.type) === 'order' ? 'order' : 'choice';
const optionIds = q => BINARY[q.type] || (kindOf(q) === 'order' ? (q.items || []).map(i => i.id) : (q.answers || []).map(a => a.id));
const EVALUATE = {
  choice: (q, a) => a === q.correctAnswer,
  order:  (q, a) => Array.isArray(a) && a.join('|') === q.items.map(i => i.id).join('|')
};
function shuffled(ids){
  if (ids.length < 2) return ids.slice();
  let out;
  do { out = ids.slice(); for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; } }
  while (out.join('|') === ids.join('|'));
  return out;
}

/* Question bank: validated against the schema, indexed by id and chapter. */
function buildBank(list){
  const chapterIds = (TC.CHAPTERS || []).map(c => c.id).concat(['t']);  // 't' = test fixtures
  const byId = {}, byChapter = {}, report = { accepted:0, excluded:[], warnings:[], byType:{} };
  (list || []).forEach(q => {
    const r = TC.schema.check(q, chapterIds);
    if (q && byId[q.id]) r.errors.push('duplicate id');
    if (r.errors.length) { report.excluded.push({ id:q && q.id, errors:r.errors }); console.warn('[content] excluded', q && q.id, '—', r.errors.join('; ')); return; }
    if (r.warnings.length) report.warnings.push({ id:q.id, warnings:r.warnings });
    byId[q.id] = q; (byChapter[q.chapter] = byChapter[q.chapter] || []).push(q.id);
    report.accepted++; report.byType[q.type] = (report.byType[q.type] || 0) + 1;
  });
  return { byId, byChapter, report, chapter: id => (byChapter[id] || []).slice(), get: id => byId[id] };
}

/* ---- scoring rules (pure). Mistakes never cost points unless the player bet "I'm sure". ---- */
TC.scoring = {
  RULES:{ correct:100, fast:25, streak:50, streakFrom:3, hard:150, expert:250, source:10, chapter:200, sureBonus:100, sureMiss:-50, focusStart:3,
          fastWindowMs:{ decision:15000, default:20000 } },
  fastWindow(q){ return this.RULES.fastWindowMs[q.type] || this.RULES.fastWindowMs.default; },
  tier(streak){ return streak >= 10 ? 'historian' : streak >= 5 ? 'momentum' : streak >= this.RULES.streakFrom ? 'insight' : null; },
  forAnswer(q, correct, ctx = {}){
    const R = this.RULES, parts = []; let streak = ctx.streakBefore || 0;
    if (correct) {
      parts.push(['correct', R.correct]);
      if (ctx.confidence === 'sure') parts.push(['sure', R.sureBonus]);
      if (q.difficulty === 'hard') parts.push(['hard', R.hard]);
      if (q.difficulty === 'expert') parts.push(['expert', R.expert]);
      if (ctx.elapsedMs != null && ctx.elapsedMs <= this.fastWindow(q)) parts.push(['fast', R.fast]);
      streak += 1;
      if (streak >= R.streakFrom) parts.push(['streak', R.streak]);
    } else {
      streak = 0;
      if (ctx.confidence === 'sure') parts.push(['sureMiss', R.sureMiss]);
    }
    return { total:parts.reduce((a, p) => a + p[1], 0), parts, streak };
  }
};

/* Session: a serializable state machine.
   phase: 'question' → (lock) → 'revealed' → (next) → 'question' … → 'complete'
   Also owns run economy: score, streak, Focus, sources opened.                  */
const FRESH = () => ({ score:0, streak:0, bestStreak:0, focus:TC.scoring.RULES.focusStart, tools:{}, removed:{}, sources:{}, bonus:0 });
class Session {
  constructor(state, bank){ this.s = state; this.bank = bank; }
  static create(chapterId, bank){
    const ids = bank.chapter(chapterId);
    if (!ids.length) return null;
    return new Session(Object.assign({ v:2, chapterId, ids, index:0, phase:'question', draft:null, results:[], layouts:{} }, FRESH()), bank);
  }
  static restore(state, bank){
    if (!state || (state.v !== 1 && state.v !== 2) || !Array.isArray(state.ids) || !state.ids.length) return null;
    if (!state.ids.every(id => bank.get(id))) return null;            // content changed: discard
    if (state.index < 0 || state.index >= state.ids.length) return null;
    if (!['question','revealed','complete'].includes(state.phase)) return null;
    const s = Object.assign(FRESH(), { layouts:{} }, JSON.parse(JSON.stringify(state)), { v:2 });
    return new Session(s, bank);
  }
  get chapterId(){ return this.s.chapterId; }
  get index(){ return this.s.index; }
  get total(){ return this.s.ids.length; }
  get phase(){ return this.s.phase; }
  get draft(){ return this.s.draft; }
  get question(){ return this.bank.get(this.s.ids[this.s.index]); }
  get kind(){ return kindOf(this.question); }
  get options(){ return optionIds(this.question); }
  get score(){ return this.s.score; }
  get streak(){ return this.s.streak; }
  get bestStreak(){ return this.s.bestStreak; }
  get focus(){ return this.s.focus; }
  get sourcesOpened(){ return Object.keys(this.s.sources).length; }
  get removed(){ return (this.s.removed[this.s.index] || []).slice(); }
  get toolsUsed(){ return (this.s.tools[this.s.index] || []).slice(); }
  get anchored(){ return this.toolsUsed.includes('anchor') ? this.question.items[0].id : null; }
  get layout(){
    if (this.kind !== 'order') return this.options;
    let l = this.s.layouts[this.s.index];
    if (!l || l.length !== this.options.length) { l = shuffled(this.options); this.s.layouts[this.s.index] = l; }
    return l.slice();
  }
  get result(){ return this.s.phase === 'question' ? null : this.s.results[this.s.index] || null; }
  get results(){ return this.s.results.slice(); }
  select(id){
    if (this.s.phase !== 'question' || this.kind !== 'choice' || !this.options.includes(id) || this.removed.includes(id)) return false;
    this.s.draft = id; TC.bus.emit('engine:change', this); return true;
  }
  toggleItem(id){
    if (this.s.phase !== 'question' || this.kind !== 'order' || !this.options.includes(id) || id === this.anchored) return false;
    const d = Array.isArray(this.s.draft) ? this.s.draft.slice() : [], i = d.indexOf(id);
    i >= 0 ? d.splice(i, 1) : d.push(id);
    this.s.draft = d; TC.bus.emit('engine:change', this); return true;
  }
  resetOrder(){ if (this.s.phase !== 'question' || this.kind !== 'order') return false; this.s.draft = this.anchored ? [this.anchored] : []; TC.bus.emit('engine:change', this); return true; }
  /* Focus tools: remove (one wrong option), source (show where to look), anchor (order: place the earliest item) */
  canUse(tool){
    if (this.s.phase !== 'question' || this.s.focus <= 0 || this.toolsUsed.includes(tool)) return false;
    const fam = TC.schema.FAMILY(this.question.type);
    if (tool === 'remove') { if (fam !== 'choice' && fam !== 'map') return false; return this.options.filter(id => id !== this.question.correctAnswer && !this.removed.includes(id)).length >= 2; }
    if (tool === 'anchor') return fam === 'order';
    if (tool === 'source') return true;
    return false;
  }
  useFocus(tool){
    if (!this.canUse(tool)) return false;
    const q = this.question, i = this.s.index;
    if (tool === 'remove') {
      const pool = this.options.filter(id => id !== q.correctAnswer && !this.removed.includes(id) && id !== this.s.draft);
      const pick = (pool.length ? pool : this.options.filter(id => id !== q.correctAnswer && !this.removed.includes(id)))[Math.floor(Math.random() * Math.max(1, pool.length))];
      this.s.removed[i] = this.removed.concat(pick);
      if (this.s.draft === pick) this.s.draft = null;
    }
    if (tool === 'anchor') { const first = q.items[0].id, d = Array.isArray(this.s.draft) ? this.s.draft.filter(x => x !== first) : []; this.s.draft = [first].concat(d); }
    this.s.tools[i] = this.toolsUsed.concat(tool); this.s.focus--;
    TC.bus.emit('engine:focus', { session:this, tool }); return true;
  }
  canLock(){
    if (this.s.phase !== 'question') return false;
    return this.kind === 'order' ? Array.isArray(this.s.draft) && this.s.draft.length === this.options.length : this.s.draft != null;
  }
  lock(meta = {}){
    if (!this.canLock()) return null;
    const q = this.question, correct = !!EVALUATE[this.kind](q, this.s.draft);
    const sc = TC.scoring.forAnswer(q, correct, { elapsedMs:meta.elapsedMs, streakBefore:this.s.streak, confidence:meta.confidence });
    const before = this.s.score;
    this.s.score = Math.max(0, before + sc.total);
    const r = { id:q.id, answer:this.s.draft, correct, points:this.s.score - before, parts:sc.parts, confidence:meta.confidence || 'safe', streak:sc.streak };
    this.s.streak = sc.streak; this.s.bestStreak = Math.max(this.s.bestStreak, sc.streak);
    this.s.results[this.s.index] = r; this.s.phase = 'revealed'; this.s.draft = null;
    TC.bus.emit('engine:lock', { session:this, result:r }); return r;
  }
  openSource(){
    if (this.s.phase === 'complete' || this.s.sources[this.s.index]) return false;
    this.s.sources[this.s.index] = true; this.s.score += TC.scoring.RULES.source;
    TC.bus.emit('engine:source', { session:this, points:TC.scoring.RULES.source }); return true;
  }
  next(){
    if (this.s.phase !== 'revealed') return false;
    if (this.s.index + 1 >= this.total) {
      this.s.phase = 'complete'; this.s.bonus = TC.scoring.RULES.chapter; this.s.score += this.s.bonus;
      TC.bus.emit('engine:complete', this);
    } else { this.s.index++; this.s.phase = 'question'; TC.bus.emit('engine:next', this); }
    return true;
  }
  summary(){
    const res = this.s.results.filter(Boolean);
    return { chapterId:this.s.chapterId, total:this.total, answered:res.length, correct:res.filter(r => r.correct).length, results:res,
             score:this.s.score, bestStreak:this.s.bestStreak, sourcesOpened:this.sourcesOpened, bonus:this.s.bonus };
  }
  toJSON(){ return JSON.parse(JSON.stringify(this.s)); }
}

TC.engine = { Session, buildBank, kindOf, optionIds, BINARY };
TC.bank = buildBank(TC.content.all());
TC.isChapterLive = id => { const c = (TC.CHAPTERS || []).find(x => x.id === id); return !!c && c.status === 'live' && TC.bank.chapter(id).length > 0; };
})(window.TC);
</script>
