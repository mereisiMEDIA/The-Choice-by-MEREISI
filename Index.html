};

G.question = s => {
  const q = s.question, binary = !!TC.engine.BINARY[q.type];
  let h = `<p class="eyebrow"><span class="yr">${esc(q.year || '')}</span><span>${esc(t('game.types.' + q.type))}</span><span class="d">${esc(t('game.diff.' + q.difficulty))}</span></p>`;
  h += `<p class="situation">${esc(TC.i18n.tx(q.situation))}</p>`;
  if (q.context && q.context.length) h += `<ul class="ctx">${q.context.map(c => `<li>${esc(TC.i18n.tx(c))}</li>`).join('')}</ul>`;
  h += binary ? `<p class="qlabel" id="qprompt">${esc(t('game.statement'))}</p><p class="statement">${esc(TC.i18n.tx(q.question))}</p>`
              : `<h2 class="qtext" id="qprompt">${esc(TC.i18n.tx(q.question))}</h2>`;
  return h;
};

G.answers = s => {
  const q = s.question, binary = !!TC.engine.BINARY[q.type], r = s.result, locked = !!r;
  return `<div class="answers${binary ? ' binary' : ''}${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${s.options.map((id, i) => {
    let cls = '', tag = '';
    if (locked) {
      if (id === q.correctAnswer) { cls = 'is-right'; tag = `<span class="tag">${tick}${esc(t('game.rightAnswer'))}</span>`; }
      else if (id === r.answer) { cls = 'is-wrong'; tag = `<span class="tag">${cross}${esc(t('game.yourAnswer'))}</span>`; }
    }
    const pressed = locked ? id === r.answer : s.draft === id;
    return `<button class="ans ${cls}" data-action="select" data-id="${esc(id)}" aria-pressed="${pressed}"${locked ? ' aria-disabled="true"' : ''}>${binary ? '' : `<span class="k" aria-hidden="true">${String.fromCharCode(65 + i)}</span>`}<span class="lbl">${esc(G.optionLabel(q, id))}${tag}</span></button>`;
  }).join('')}</div>`;
};

G.sources = (q, open) => `<div class="card src glass"><button class="srctoggle" data-action="toggleSources" aria-expanded="${!!open}" aria-controls="srcpanel">${esc(t(open ? 'game.hideSource' : 'game.checkSource'))} (${q.sources.length})${chev}</button>
  <div id="srcpanel"${open ? '' : ' hidden'}><ul class="srclist">${q.sources.map(src => `<li><a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer"><span class="ty ${esc(src.type)}">${esc(t('game.srcTypes.' + src.type))}</span><span>${esc(src.title)}<span class="u">${esc(src.url.replace(/^https?:\/\//, ''))}</span></span>${ext}</a></li>`).join('')}</ul><p class="note">${esc(t('game.srcNote'))}</p></div></div>`;

G.reveal = (s, ui) => {
  const q = s.question, r = s.result; if (!r) return '';
  const decision = q.type === 'decision';
  const head = decision ? t(r.correct ? 'game.happened' : 'game.otherWay') : t(r.correct ? 'game.correct' : 'game.notQuite');
  return `<section class="reveal" id="reveal" aria-labelledby="verdict">
    <h2 class="verdict ${r.correct ? 'ok' : 'no'}" id="verdict" tabindex="-1">${r.correct ? tick : cross}<span>${esc(head)}</span></h2>
    <div class="card what glass"><h3>${esc(t('game.whatHappened'))}</h3><p>${esc(TC.i18n.tx(q.explanation))}</p>${decision ? `<p class="note">${esc(t('game.decisionNote'))}</p>` : ''}</div>
    ${q.didYouKnow ? `<div class="card dyk glass"><h3>${esc(t('game.dyk'))}</h3><p>${esc(TC.i18n.tx(q.didYouKnow))}</p></div>` : ''}
    ${G.sources(q, ui.sourcesOpen)}
  </section>`;
};

G.action = s => {
  if (s.phase === 'question') { const ok = s.canLock(); return `<div class="actionbar"><button class="btn btn-primary" style="width:100%" data-action="lock"${ok ? '' : ' disabled'}>${esc(t(ok ? 'game.lockIn' : 'game.makeChoice'))}</button></div>`; }
  const last = s.index + 1 >= s.total;
  return `<div class="actionbar"><button class="btn btn-primary" style="width:100%" data-action="next">${esc(t(last ? 'game.finish' : 'game.next'))}</button></div>`;
};
})();


/* ---- Phase 3: renderers per question family (choice · binary · map · order) ---- */
(function(){
const G = TC.ui.game, R = TC.ui.renderers = {};
const { tick, cross } = TC.ui.marks;
const tx = o => TC.i18n.tx(o);
const markTag = (ok, label) => `<span class="tag">${ok ? tick : cross}${esc(label)}</span>`;

R.choice = s => {
  const q = s.question, r = s.result, locked = !!r;
  return `<div class="answers${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${s.options.map((id, i) => {
    let cls = '', tag = '';
    if (locked) { if (id === q.correctAnswer) { cls = 'is-right'; tag = markTag(true, t('game.rightAnswer')); } else if (id === r.answer) { cls = 'is-wrong'; tag = markTag(false, t('game.yourAnswer')); } }
    else if (s.removed.includes(id)) cls = 'gone';
    return `<button class="ans ${cls}" data-action="select" data-id="${esc(id)}" aria-pressed="${locked ? id === r.answer : s.draft === id}"${locked ? ' aria-disabled="true"' : ''}${cls === 'gone' ? ' disabled' : ''}><span class="k" aria-hidden="true">${String.fromCharCode(65 + i)}</span><span class="lbl">${esc(G.optionLabel(q, id))}${tag}</span></button>`;
  }).join('')}</div>`;
};
R.binary = s => {
  const q = s.question, r = s.result, locked = !!r;
  return `<div class="answers binary${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${s.options.map(id => {
    let cls = '', tag = '';
    if (locked) { if (id === q.correctAnswer) { cls = 'is-right'; tag = markTag(true, t('game.rightAnswer')); } else if (id === r.answer) { cls = 'is-wrong'; tag = markTag(false, t('game.yourAnswer')); } }
    return `<button class="ans ${cls}" data-action="select" data-id="${esc(id)}" aria-pressed="${locked ? id === r.answer : s.draft === id}"${locked ? ' aria-disabled="true"' : ''}><span class="lbl">${esc(G.optionLabel(q, id))}${tag}</span></button>`;
  }).join('')}</div>`;
};

/* map challenge: schematic map with lettered regions; buttons below are the accessible controls */
const REG = {
  sinai:{ pts:'198,254 245,258 288,262 315,253 323,260 353,361 340,392 330,430 320,456 315,466 290,430 255,380 222,338 213,332 205,300', c:[282,352] },
  gaza:{ pts:'315,253 332,237 341,243 323,260', c:[322,246] },
  westbank:{ pts:'360,180 372,176 393,186 391,205 390,225 386,248 372,250 360,249 357,235 362,222 357,210 361,196', c:[376,214] },
  golan:{ pts:'396,132 411,135 414,165 398,168 396,156', c:[405,150] }
};
const letter = (q, id) => String.fromCharCode(65 + q.answers.findIndex(a => a.id === id));
R.map = s => {
  const q = s.question, r = s.result, locked = !!r, chosen = locked ? r.answer : s.draft;
  const state = id => locked ? (id === q.correctAnswer ? 'ok' : id === r.answer ? 'no' : '') : (id === chosen ? 'sel' : (s.removed.includes(id) ? 'gone' : ''));
  let svg = `<svg class="mapq" viewBox="185 92 245 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t('game.mapNote'))}" focusable="false">
    <rect class="land" x="0" y="0" width="600" height="480"/><polygon class="sea" points="0,0 ${COAST}"/><polyline class="coast" points="${COAST}"/><polygon class="sea" points="${RED_SEA}"/><polygon class="coast" points="${RED_SEA}"/>
    <polygon class="terr" points="${ISRAEL_AREA}"/><ellipse class="sea" cx="388" cy="246" rx="4" ry="14"/><ellipse class="sea" cx="395" cy="160" rx="3.5" ry="6"/>
    <text class="lbl sea" x="250" y="170" text-anchor="middle">${esc(t('map.med'))}</text><text class="lbl" x="238" y="300" text-anchor="middle">${esc(t('map.egypt'))}</text><text class="lbl" x="420" y="290" text-anchor="middle">${esc(t('map.jordan'))}</text><text class="lbl" x="418" y="112" text-anchor="middle">${esc(t('map.syria'))}</text>`;
  q.answers.forEach(a => { const g = REG[a.id]; svg += `<polygon class="rg ${state(a.id)}" points="${g.pts}" data-action="select" data-id="${a.id}" aria-hidden="true"/>`; });
  q.answers.forEach(a => { const g = REG[a.id]; svg += `<circle cx="${g.c[0]}" cy="${g.c[1]}" r="15" fill="transparent" data-action="select" data-id="${a.id}" aria-hidden="true"/><text class="rlbl ${state(a.id)}" x="${g.c[0]}" y="${g.c[1] + 4}" text-anchor="middle">${letter(q, a.id)}</text>`; });
  svg += '</svg>';
  const btns = q.answers.map(a => {
    const id = a.id, L = letter(q, id); let cls = '', tag = '';
    if (locked) { if (id === q.correctAnswer) { cls = 'is-right'; tag = markTag(true, t('game.rightAnswer')); } else if (id === r.answer) { cls = 'is-wrong'; tag = markTag(false, t('game.yourAnswer')); } }
    if (!locked && s.removed.includes(id)) cls = 'gone';
    const label = locked ? t('map.regions.' + id) : TC.i18n.f('game.region', { l:L });
    return `<button class="ans ${cls}" data-action="select" data-id="${id}" aria-pressed="${locked ? id === r.answer : chosen === id}"${locked ? ' aria-disabled="true"' : ''}${cls === 'gone' ? ' disabled' : ''}><span class="k" aria-hidden="true">${L}</span><span class="lbl">${esc(label)}${tag}</span></button>`;
  }).join('');
  return `<div class="mapstage map">${svg}<span class="mapnote">${esc(t('game.mapNote'))}</span></div><div class="answers mapbtns${locked ? ' done' : ''}" role="group" aria-labelledby="qprompt">${btns}</div>`;
};

/* order / timeline: tap items earliest → latest; tap again to remove */
R.order = s => {
  const q = s.question, r = s.result, locked = !!r;
  const placed = locked ? r.answer : (s.draft || []);
  const ids = locked ? q.items.map(i => i.id) : s.layout;
  const rows = ids.map((id, pos) => {
    const it = q.items.find(i => i.id === id), n = placed.indexOf(id);
    if (locked) {
      const ok = placed[pos] === id;
      return `<li class="ans ord ${ok ? 'is-right' : 'is-wrong'}"><span class="k" aria-hidden="true">${pos + 1}</span><span class="lbl">${esc(tx(it.text))}${ok ? markTag(true, t('game.inPlace')) : markTag(false, TC.i18n.f('game.youPlaced', { n:n + 1 }))}</span><span class="yr">${esc(it.year)}</span></li>`;
    }
    return `<li><button class="ans ord${n >= 0 ? ' placed' : ''}${id === s.anchored ? ' anchored' : ''}" data-action="orderTap" data-id="${esc(id)}"${id === s.anchored ? ' disabled' : ''} aria-pressed="${n >= 0}" aria-label="${esc(tx(it.text))}${n >= 0 ? ' — ' + (n + 1) : ''}"><span class="k" aria-hidden="true">${n >= 0 ? n + 1 : ''}</span><span class="lbl">${esc(tx(it.text))}</span></button></li>`;
  }).join('');
  const reset = !locked && placed.length ? `<button class="btn btn-ghost btn-sm" data-action="orderReset" style="align-self:flex-start;margin-top:4px">${esc(t('game.resetOrder'))}</button>` : '';
  return `<p class="qlabel">${esc(locked ? t('game.correctOrder') : TC.i18n.f('game.placedCount', { n:placed.length, total:q.items.length }))}</p><ol class="answers orderlist${locked ? ' done' : ''}" aria-labelledby="qprompt">${rows}</ol>${reset}`;
};

G.answers = s => R[TC.schema.FAMILY(s.question.type)](s);

/* framing per type: headline card, perspectives split, binary claim, standard prompt */
G.question = s => {
  const q = s.question, fam = TC.schema.FAMILY(q.type);
  let h = `<p class="eyebrow"><span class="yr">${esc(q.year || '')}</span><span>${esc(t('game.types.' + q.type))}</span><span class="d">${esc(t('game.diff.' + q.difficulty))}</span></p>`;
  if (q.type === 'headline') h += `<figure class="headline"><figcaption>${esc(t('game.exampleHeadline'))}</figcaption><p lang="${TC.i18n.lang}">${esc(tx(q.headlineText))}</p></figure>`;
  h += `<p class="situation">${esc(tx(q.situation))}</p>`;
  const ctx = q.context || [];
  if (q.type === 'perspectives') h += `<div class="persp">${ctx.map((c, i) => `<div><b>${esc(t(i ? 'game.perspB' : 'game.perspA'))}</b>${esc(tx(c))}</div>`).join('')}</div>`;
  else if (ctx.length) h += `<ul class="ctx">${ctx.map(c => `<li>${esc(tx(c))}</li>`).join('')}</ul>`;
  h += fam === 'binary' ? `<p class="qlabel" id="qprompt">${esc(t('game.statement'))}</p><p class="statement">${esc(tx(q.question))}</p>`
                        : `<h2 class="qtext" id="qprompt">${esc(tx(q.question))}</h2>`;
  return h;
};
})();

})(window.TC);
</script>

<!-- ================= APP: screens · router · boot ================= -->
<script id="tc-app">
(function(TC){
'use strict';
const { esc, icon, ui } = TC;
const t = k => TC.i18n.t(k);
const app = document.getElementById('app');
const live = document.getElementById('live');
const announce = msg => { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 40); };

/* ---- screens: each returns markup; `after` runs once mounted ---- */
const SCREENS = {
  loading: {
    dim:false,
    view: () => `<section class="screen loading"><div class="stagecenter">${ui.logo()}<p class="tagline" style="font-size:16px">${esc(t('brand.tagline'))}</p><p class="dots" role="status">${esc(t('loading.line'))}</p></div></section>`
  },
  intro: {
    dim:false,
    view: p => {
      const d = p.fast ? 0 : (p.quick ? .28 : 1);   // returning players get a short intro
      return `<section class="screen intro${p.fast ? ' fast' : ''}" aria-labelledby="intro-title">
        <button class="skip" data-action="skipIntro">${esc(t('intro.skip'))}</button>
        <div class="stagecenter">
          <h1 id="intro-title" class="reveal" style="margin:0;animation-delay:${2.2 * d}s">${ui.logo()}</h1>
          <p class="tagline reveal" style="animation-delay:${3.1 * d}s">${esc(t('brand.tagline'))}</p>
          <p class="poem"><span class="reveal" style="animation-delay:${4.6 * d}s">${esc(t('intro.poem1'))}</span><span class="reveal" style="animation-delay:${5.5 * d}s">${esc(t('intro.poem2'))}</span><span class="reveal" style="animation-delay:${6.3 * d}s"><b>${esc(t('intro.poem3'))}</b></span></p>
          <div class="cta reveal" style="animation-delay:${7.3 * d}s">
            <button class="btn btn-primary" data-action="start">${esc(t('intro.start'))}</button>
            ${ui.langSwitch()}
          </div>
        </div></section>`;
    }
  },
  menu: {
    dim:false,
    view: () => `<section class="screen" aria-labelledby="menu-title">
      ${ui.topbar()}
      <div class="menu-hero"><h1 id="menu-title" style="margin:0">${ui.logo()}</h1><p class="tagline" style="font-size:15px">${esc(t('brand.tagline'))}</p></div>
      <nav class="nav" aria-label="${esc(t('common.menuLabel'))}">
        ${ui.continueItem ? ui.continueItem() : ''}
        <button class="btn btn-primary" data-action="nav" data-to="play">${icon('play')} ${esc(t('menu.play'))}</button>
        ${ui.navItem({ id:'daily', iconName:'calendar', label:t('menu.daily'), locked:true, featured:true })}
        <div class="nav-grid">
          ${ui.navItem({ id:'collection', iconName:'cards', label:t('menu.collection'), locked:true })}
          ${ui.navItem({ id:'achievements', iconName:'trophy', label:t('menu.achievements'), locked:true })}
          ${ui.navItem({ id:'how', iconName:'help', label:t('menu.how'), locked:true })}
          ${ui.navItem({ id:'sources', iconName:'book', label:t('menu.sources'), locked:true })}
        </div>
        ${ui.navItem({ id:'settings', iconName:'settings', label:t('menu.settings') })}
      </nav></section>`
  },
  play: {
    dim:true,
    view: () => `<section class="screen" aria-labelledby="play-title">
      ${ui.topbar({ back:true })}
      <h1 id="play-title" class="h1">${esc(t('play.title'))}</h1>
      <p class="lede">${esc(t('play.lede'))}</p>
      <div class="chapters">${TC.CHAPTERS.map(ui.chapterCard).join('')}</div></section>`
  },
  settings: {
    dim:true,
    view: () => {
      const m = TC.storage.getPref('motion');
      const mb = (v, k) => `<button data-action="motion" data-value="${v}" aria-pressed="${m === v}">${esc(t('settings.' + k))}</button>`;
      return `<section class="screen" aria-labelledby="set-title">
        ${ui.topbar({ back:true })}
        <h1 id="set-title" class="h1">${esc(t('settings.title'))}</h1>
        <div class="rows glass" style="margin-top:14px">
          <div class="row stack"><div><b>${esc(t('common.language'))}</b><p>${esc(t('settings.langSub'))}</p></div>${ui.langSwitch()}</div>
          <div class="row"><div><b>${esc(t('settings.sound'))}</b><p>${esc(t('settings.soundSub'))}</p></div>${ui.switchCtl('toggleSound', TC.storage.getPref('sound'), t('settings.sound'))}</div>
          <div class="row stack"><div><b>${esc(t('settings.motion'))}</b><p>${esc(t('settings.motionSub'))}</p></div><div class="seg" role="group" aria-label="${esc(t('settings.motion'))}">${mb('system', 'system')}${mb('full', 'full')}${mb('reduced', 'reduced')}</div></div>
        </div>
        <p class="footnote">${esc(t('settings.saved'))}</p></section>`;
    }
  }
};
const ROUTABLE = ['menu', 'play', 'settings'];

/* ---- router: hash routes for real screens; intro/loading are transient ---- */
let current = null, params = {};
function mount(name, p = {}){
  const def = SCREENS[name];
  if (def.guard) { const to = def.guard(p); if (to) return go(to); }
  current = name; params = p;
  app.innerHTML = def.view(p);
  document.body.classList.toggle('dim', !!def.dim);
  def.after && def.after(p);
  const h = app.querySelector('h1');
  if (h && ROUTABLE.includes(name)) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll:true }); }
}
function go(name){
  if (!ROUTABLE.includes(name)) return mount(name);
  const target = '#/' + name;
  if (location.hash !== target) location.hash = target; else route();
}
function route(){
  const name = (location.hash.match(/^#\/(\w+)/) || [])[1];
  if (!ROUTABLE.includes(name) || !booted) return;
  if (name !== current) { TC.audio.whoosh(); window.scrollTo(0, 0); }
  mount(name);
}
window.addEventListener('hashchange', route);

/* ---- actions (event delegation) ---- */
const ACTIONS = {
  nav: el => { TC.audio.tap(); go(el.dataset.to); },
  soon: () => { TC.audio.tap(); ui.toast(t('common.comingSoon')); },
  chapter: () => { TC.audio.tap(); ui.toast(t('play.chapterSoon')); },
  start: () => { TC.audio.unlock(); TC.audio.chime(); booted = true; go('menu'); },
  skipIntro: () => mount('intro', { fast:true }),
  lang: el => { TC.audio.tap(); TC.i18n.set(el.dataset.lang); },
  toggleSound: () => { const v = !TC.storage.getPref('sound'); TC.storage.setPref('sound', v); if (v) { TC.audio.unlock(); TC.audio.tap(); } mount(current, params); announce(t('settings.sound') + ': ' + (v ? 'on' : 'off')); },
  motion: el => { TC.audio.tap(); TC.storage.setPref('motion', el.dataset.value); mount(current, params); }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || !app.contains(el)) return;
  const fn = ACTIONS[el.dataset.action]; if (fn) fn(el);
});
// atmosphere can begin on the very first touch, even before START
window.addEventListener('pointerdown', function first(){ if (TC.storage.getPref('sound')) TC.audio.unlock(); window.removeEventListener('pointerdown', first); }, { once:true });

/* ---- re-render on language change; keep focus on the language control ---- */
TC.bus.on('lang', l => {
  renderBackground(true);
  mount(current, Object.assign({}, params, current === 'intro' ? { fast:true } : {}));
  const btn = app.querySelector(`[data-action="lang"][data-lang="${l}"]`); if (btn) btn.focus();
  announce(l === 'he' ? 'עברית' : 'English');
});

/* ---- background ---- */
function renderBackground(instant){
  const bm = document.getElementById('bgmap');
  bm.innerHTML = ui.map({ lit:true, delay:instant ? 0 : .9, step:instant ? 0 : .34 });
  if (instant) bm.querySelectorAll('.city').forEach(c => c.style.animationDelay = '0s');
}
function motes(){
  const m = document.getElementById('motes'); let h = '';
  for (let i = 0; i < 14; i++) h += `<i style="left:${(i * 73) % 100}%;animation-duration:${18 + (i * 7) % 16}s;animation-delay:${-(i * 3.1) % 20}s;opacity:.${2 + i % 3}"></i>`;
  m.innerHTML = h;
}


/* ================= Phase 2: game loop wiring ================= */
let session = null;
const ui2 = { sourcesOpen:false };
function saveRun(){ TC.storage.setSection('run', session && session.phase !== 'complete' ? session.toJSON() : null); }
function loadRun(){ const st = TC.storage.getSection('run'); return st ? TC.engine.Session.restore(st, TC.bank) : null; }

SCREENS.game = {
  dim:true,
  view: () => {
    if (!session || session.phase === 'complete') return '';
    return `<section class="screen" aria-label="${esc(TC.i18n.f('game.progress', { i:session.index + 1, n:session.total }))}">
      ${ui.game.header(session)}
      <div class="gamebody">
        ${ui.game.question(session)}
        ${typeof coachHTML === 'function' ? coachHTML() : ''}
        <div id="answers">${ui.game.answers(session)}</div>
        ${ui.game.reveal(session, ui2)}
        ${ui.game.action(session)}
      </div></section>`;
  },
  guard: () => (!session || session.phase === 'complete') ? 'play' : null
};
SCREENS.results = {
  dim:true,
  view: () => {
    const sum = session && session.phase === 'complete' ? session.summary() : null;
    if (!sum) return '';
    const ch = TC.CHAPTERS.find(c => c.id === sum.chapterId);
    return `<section class="screen results" aria-labelledby="res-title">
      ${ui.topbar({ back:true })}
      <p class="lab">${esc(t('play.chapter'))} ${ch.n} · ${esc(TC.i18n.tx(ch.name))}</p>
      <h1 id="res-title" class="h1" style="text-align:center">${esc(t('results.title'))}</h1>
      <p class="bigstat">${sum.correct}/${sum.total}</p><p class="lab">${esc(t('results.correct'))}</p>
      <p class="closing">${esc(TC.i18n.f('results.closing1', { n:sum.total }))}<b>${esc(t('results.closing2'))}</b></p>
      <ul class="rlist">${sum.results.map(r => { const q = TC.bank.get(r.id); return `<li class="glass ${r.correct ? 'ok' : 'no'}">${r.correct ? ui.marks.tick : ui.marks.cross}<span class="sr">${esc(t(r.correct ? 'game.correct' : 'game.notQuite'))}</span><span>${esc(TC.i18n.tx(q.question))}</span></li>`; }).join('')}</ul>
      <div class="btncol"><button class="btn btn-primary" data-action="chapter" data-id="${sum.chapterId}" data-fresh="1">${esc(t('results.again'))}</button>
        <button class="btn btn-ghost" data-action="nav" data-to="play">${esc(t('results.chapters'))}</button></div></section>`;
  },
  guard: () => (!session || session.phase !== 'complete') ? 'play' : null
};
ROUTABLE.push('game', 'results');

function renderGame(focusReveal){
  const y = window.scrollY;
  app.innerHTML = SCREENS.game.view();
  app.firstElementChild && app.firstElementChild.classList.add('static');
  window.scrollTo(0, y);
  if (focusReveal) {
    const r = document.getElementById('reveal'), v = document.getElementById('verdict');
    if (r) setTimeout(() => { r.scrollIntoView({ behavior:TC.motion.reduced ? 'auto' : 'smooth', block:'start' }); v && v.focus({ preventScroll:true }); }, 60);
  }
}

let startChapter = function(id, fresh){
  const saved = !fresh && loadRun();
  session = (saved && saved.chapterId === id) ? saved : TC.engine.Session.create(id, TC.bank);
  if (!session) { ui.toast(t('play.chapterSoon')); return; }
  ui2.sourcesOpen = false; saveRun(); go('game');
};

Object.assign(ACTIONS, {
  chapter: el => {
    TC.audio.tap();
    if (!TC.isChapterLive(el.dataset.id)) { ui.toast(t('play.chapterSoon')); return; }
    startChapter(el.dataset.id, el.dataset.fresh === '1');
  },
  select: el => { if (session && session.select(el.dataset.id)) { TC.audio.tap(); saveRun(); renderGame(); const b = app.querySelector(`button[data-action="select"][data-id="${CSS.escape(el.dataset.id)}"]`); b && b.focus({ preventScroll:true }); } },
  orderTap: el => { if (session && session.toggleItem(el.dataset.id)) { TC.audio.tap(); saveRun(); renderGame(); const b = app.querySelector(`[data-action="orderTap"][data-id="${CSS.escape(el.dataset.id)}"]`); b && b.focus({ preventScroll:true }); } },
  orderReset: () => { if (session && session.resetOrder()) { TC.audio.tap(); saveRun(); renderGame(); const b = app.querySelector('[data-action="orderTap"]'); b && b.focus({ preventScroll:true }); } },
  lock: () => { if (!session) return; const r = session.lock(); if (!r) return; ui2.sourcesOpen = false; saveRun(); r.correct ? TC.audio.chime() : TC.audio.whoosh(); renderGame(true); announce(t(r.correct ? 'game.correct' : 'game.notQuite')); },
  next: () => { if (!session || !session.next()) return; ui2.sourcesOpen = false; saveRun(); if (session.phase === 'complete') go('results'); else { TC.audio.whoosh(); window.scrollTo(0, 0); mount('game'); } },
  toggleSources: () => { ui2.sourcesOpen = !ui2.sourcesOpen; renderGame(); const b = app.querySelector('[data-action="toggleSources"]'); b && b.focus({ preventScroll:true }); },
  leave: () => { TC.audio.tap(); saveRun(); go('menu'); }
});

/* Play screen: chapters with content become playable; resume state shown */
TC.ui.chapterCard = c => {
  const n = TC.isChapterLive(c.id) ? TC.bank.chapter(c.id).length : 0;
  const run = loadRun(), resume = run && run.chapterId === c.id && run.phase !== 'complete' ? run : null;
  const pill = n ? `<span class="pill go">${esc(resume ? TC.i18n.f('play.resume', { i:resume.index + 1, n:resume.total }) : TC.i18n.f('play.choices', { n }))}</span>`
                 : `<span class="pill">${TC.icon('lock')}${esc(t('play.building'))}</span>`;
  return `<button class="chap" style="--tint:${c.tint}" data-action="chapter" data-id="${c.id}"${n ? '' : ' aria-disabled="true"'}>
    <span class="num" aria-hidden="true">${c.n}</span>
    <span><span class="sr">${esc(t('play.chapter'))} ${c.n}: </span><span class="nm">${esc(TC.i18n.tx(c.name))}</span><span class="ds">${esc(TC.i18n.tx(c.desc))}</span>${pill}</span></button>`;
};

/* Keyboard: 1–9 choose, Enter locks / advances (when focus is not on a control) */
document.addEventListener('keydown', e => {
  if (current !== 'game' || !session || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (/^[1-9]$/.test(e.key) && session.phase === 'question') {
    if (session.kind === 'order') { const id = session.layout[+e.key - 1]; if (id) { e.preventDefault(); ACTIONS.orderTap({ dataset:{ id } }); } }
    else { const id = session.options[+e.key - 1]; if (id) { e.preventDefault(); ACTIONS.select({ dataset:{ id } }); } }
  } else if (e.key === 'Enter' && session.phase === 'question' && document.activeElement && document.activeElement.dataset.action === 'select' && document.activeElement.dataset.id === session.draft) {
    e.preventDefault(); ACTIONS.lock();                 // Enter on the chosen answer locks it in
  } else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') {
    e.preventDefault(); session.phase === 'question' ? ACTIONS.lock() : ACTIONS.next();
  }
});


/* ================= Phase 4: complete chapter experience ================= */
/* progress section: { chapters:{ id:{ completed, best, plays, last } }, coachSeen } */
const progress = () => Object.assign({ chapters:{}, coachSeen:false }, TC.storage.getSection('progress') || {});
const saveProgress = p => TC.storage.setSection('progress', p);
let lastOutcome = null;   // { newBest, firstClear } for the results screen
TC.bus.on('engine:complete', s => {
  const sum = s.summary(), p = progress(), prev = p.chapters[sum.chapterId] || { completed:false, best:0, plays:0 };
  lastOutcome = { newBest: prev.completed && sum.correct > prev.best, firstClear: !prev.completed };
  p.chapters[sum.chapterId] = Object.assign({}, prev, { completed:true, best:Math.max(prev.best || 0, sum.correct), plays:(prev.plays || 0) + 1, last:sum.correct, total:sum.total });
  saveProgress(p);
});

let introChapter = null;
const minutes = n => Math.max(1, Math.round(n * 50 / 60));
SCREENS.chapter = {
  dim:true,
  view: () => {
    const c = TC.CHAPTERS.find(x => x.id === introChapter); if (!c) return '';
    const ids = TC.bank.chapter(c.id), qs = ids.map(id => TC.bank.get(id));
    const types = [...new Set(qs.map(q => q.type))];
    const run = loadRun(), resume = run && run.chapterId === c.id && run.phase !== 'complete' ? run : null;
    const pr = progress().chapters[c.id];
    return `<section class="screen chapintro" style="--tint:${c.tint}" aria-labelledby="ci-name">
      <header class="topbar"><button class="iconbtn" data-action="nav" data-to="play" aria-label="${esc(t('common.back'))}">${icon('back', 'flip')}</button></header>
      <div class="ci-hero">
        <span class="ci-num" aria-hidden="true">${c.n}</span>
        <p class="ci-kicker">${esc(t('play.chapter'))} ${c.n}</p>
        <h1 class="ci-name" id="ci-name">${esc(TC.i18n.tx(c.name))}</h1>
        <p class="ci-desc">${esc(TC.i18n.tx(c.desc))}</p>
        <ul class="ci-meta">
          <li>${esc(TC.i18n.f('chapter.choices', { n:ids.length }))}</li>
          <li>${esc(TC.i18n.f('chapter.minutes', { m:minutes(ids.length) }))}</li>
          ${pr && pr.completed ? `<li class="best">${esc(TC.i18n.f('chapter.best', { c:pr.best, n:ids.length }))}</li>` : ''}
        </ul>
        <p class="qlabel">${esc(t('chapter.inside'))}</p>
        <ul class="ci-types">${types.map(ty => `<li>${esc(t('game.types.' + ty))}</li>`).join('')}</ul>
      </div>
      <div class="actionbar btncol">
        <button class="btn btn-primary" data-action="beginChapter">${icon('play')} ${esc(resume ? TC.i18n.f('chapter.resume', { i:resume.index + 1, n:resume.total }) : t('chapter.begin'))}</button>
        ${resume ? `<button class="btn btn-ghost btn-sm" data-action="beginChapter" data-fresh="1">${esc(t('chapter.restart'))}</button>` : ''}
      </div></section>`;
  },
  guard: () => (!introChapter || !TC.isChapterLive(introChapter)) ? 'play' : null
};
ROUTABLE.push('chapter');

/* results: accuracy, correct answers, review with expandable explanations, next step */
SCREENS.results.view = () => {
  const sum = session && session.phase === 'complete' ? session.summary() : null;
  if (!sum) return '';
  const idx = TC.CHAPTERS.findIndex(c => c.id === sum.chapterId), ch = TC.CHAPTERS[idx], nxt = TC.CHAPTERS[idx + 1];
  const acc = Math.round(sum.correct / sum.total * 100);
  const badge = lastOutcome && lastOutcome.newBest ? t('results.newBest') : (lastOutcome && lastOutcome.firstClear ? t('results.firstClear') : '');
  const nextBlock = !nxt ? '' : TC.isChapterLive(nxt.id)
    ? `<button class="btn btn-primary" data-action="chapter" data-id="${nxt.id}">${esc(t('results.next'))}</button>`
    : `<div class="nextsoon glass"><span class="pill">${icon('lock')}${esc(t('common.soon'))}</span><span>${esc(TC.i18n.f('results.nextSoon', { n:nxt.n, name:TC.i18n.tx(nxt.name) }))}</span></div>`;
  return `<section class="screen results" aria-labelledby="res-title">
    ${ui.topbar({ back:true })}
    <p class="lab">${esc(t('play.chapter'))} ${ch.n} · ${esc(TC.i18n.tx(ch.name))}</p>
    <h1 id="res-title" class="h1" style="text-align:center">${esc(t('results.title'))}</h1>
    ${badge ? `<p class="resbadge"><span class="badge">${esc(badge)}</span></p>` : ''}
    <p class="bigstat">${sum.correct}/${sum.total}</p><p class="lab">${esc(t('results.correct'))}</p>
    <div class="statrow"><div class="stat glass"><b>${acc}%</b><span>${esc(t('results.accuracy'))}</span></div><div class="stat glass"><b>${sum.total}</b><span>${esc(t('results.explored'))}</span></div></div>
    <p class="closing">${esc(TC.i18n.f('results.closing1', { n:sum.total }))}<b>${esc(t('results.closing2'))}</b></p>
    <h2 class="qlabel">${esc(t('results.review'))}</h2>
    <p class="hint">${esc(t('results.reviewHint'))}</p>
    <ul class="rlist">${sum.results.map((r, i) => { const q = TC.bank.get(r.id); return `<li><details class="glass ${r.correct ? 'ok' : 'no'}"><summary>${r.correct ? ui.marks.tick : ui.marks.cross}<span class="sr">${esc(t(r.correct ? 'game.correct' : 'game.notQuite'))}: </span><span class="rq"><span class="rn">${i + 1}</span>${esc(TC.i18n.tx(q.card ? q.card.title : q.question))}</span></summary><p>${esc(TC.i18n.tx(q.explanation))}</p></details></li>`; }).join('')}</ul>
    <div class="btncol">
      ${nextBlock}
      <button class="btn ${nxt && TC.isChapterLive(nxt.id) ? 'btn-ghost' : 'btn-primary'}" data-action="chapter" data-id="${sum.chapterId}" data-fresh="1" data-direct="1">${esc(t('results.again'))}</button>
      <div class="btngrid"><button class="btn btn-ghost btn-sm" data-action="nav" data-to="play">${esc(t('results.chapters'))}</button><button class="btn btn-ghost btn-sm" data-action="nav" data-to="menu">${esc(t('results.menu'))}</button></div>
    </div></section>`;
};

/* first-time coach line under the very first question */
function coachHTML(){
  if (!session || session.phase !== 'question' || progress().coachSeen) return '';
  const fam = TC.schema.FAMILY(session.question.type);
  return `<p class="coach" role="note">${icon('info')}<span>${esc(t('coach.' + (fam === 'order' ? 'order' : fam === 'map' ? 'map' : 'choice')))}</span></p>`;
}
TC.bus.on('engine:lock', () => { const p = progress(); if (!p.coachSeen) { p.coachSeen = true; saveProgress(p); } });

Object.assign(ACTIONS, {
  chapter: el => {
    TC.audio.tap();
    const id = el.dataset.id;
    if (!TC.isChapterLive(id)) { ui.toast(t('play.chapterSoon')); return; }
    if (el.dataset.direct === '1') { startChapter(id, true); return; }   // Play again skips the title card
    introChapter = id; go('chapter');
  },
  beginChapter: el => { TC.audio.chime(); startChapter(introChapter, el.dataset.fresh === '1'); },
  continueRun: () => { const r = loadRun(); if (!r) return; TC.audio.tap(); session = r; ui2.sourcesOpen = false; go('game'); }
});

/* chapter cards: completed state + best result */
const baseCard = TC.ui.chapterCard;
TC.ui.chapterCard = c => {
  const pr = progress().chapters[c.id];
  let html = baseCard(c);
  if (pr && pr.completed && TC.isChapterLive(c.id)) {
    const run = loadRun(), resuming = run && run.chapterId === c.id && run.phase !== 'complete';
    if (!resuming) html = html.replace(/<span class="pill go">[^<]*<\/span>/, `<span class="pill done">${icon('check')}${esc(TC.i18n.f('play.completed', { c:pr.best, n:TC.bank.chapter(c.id).length }))}</span>`);
  }
  return html;
};
/* menu: continue an unfinished run directly */
TC.ui.continueItem = () => {
  const r = loadRun(); if (!r || r.phase === 'complete' || !TC.isChapterLive(r.chapterId)) return '';
  const c = TC.CHAPTERS.find(x => x.id === r.chapterId);
  return `<button class="nav-item glass continue" data-action="continueRun">${icon('play', 'ic')}<span class="t">${esc(t('menu.continue'))}</span><span class="s">${esc(TC.i18n.tx(c.name))} · ${r.index + 1}/${r.total}</span></button>`;
};


/* ================= Phase 5: scoring · streaks · Focus · confidence · ledger ================= */
Object.assign(ui2, { qStart:{}, confidence:'safe', newLedger:[], pendingReveal:false });
const fmt = n => Number(n).toLocaleString(TC.i18n.lang === 'he' ? 'he-IL' : 'en-US');
const totals = () => Object.assign({ insight:0, bestStreak:0 }, progress().totals || {});
function addInsight(n){ const p = progress(); p.totals = Object.assign({ insight:0, bestStreak:0 }, p.totals); p.totals.insight = Math.max(0, p.totals.insight + n); saveProgress(p); }
const allLedger = () => TC.content.all().flatMap(q => (q.ledger || []).map(l => Object.assign({ qid:q.id }, l)));

TC.bus.on('engine:lock', ({ session:s, result:r }) => {
  const p = progress(), q = TC.bank.get(r.id);
  p.totals = Object.assign({ insight:0, bestStreak:0 }, p.totals);
  p.totals.insight = Math.max(0, p.totals.insight + r.points);
  p.totals.bestStreak = Math.max(p.totals.bestStreak, s.bestStreak);
  const have = new Set(p.ledger || []), fresh = (q.ledger || []).map(l => l.id).filter(id => !have.has(id));
  p.ledger = [...have, ...fresh]; ui2.newLedger = fresh;
  saveProgress(p);
});
TC.bus.on('engine:source', ({ points }) => addInsight(points));
TC.bus.on('engine:complete', s => {
  const sum = s.summary(), p = progress(), rec = p.chapters[sum.chapterId] || {};
  const prevBest = rec.bestScore;
  rec.bestScore = Math.max(prevBest || 0, sum.score); p.chapters[sum.chapterId] = rec;
  p.totals = Object.assign({ insight:0, bestStreak:0 }, p.totals); p.totals.insight += sum.bonus;
  saveProgress(p);
  lastOutcome = { newBest: prevBest != null && sum.score > prevBest, firstClear: prevBest == null };
});

/* ---- header: progress · run score · Focus · streak tier ---- */
ui.game.header = s => {
  const res = s.results, tier = TC.scoring.tier(s.streak);
  const bars = Array.from({ length:s.total }, (_, i) => `<i class="${res[i] ? (res[i].correct ? 'ok' : 'no') : (i === s.index ? 'now' : '')}"></i>`).join('');
  return `<header class="ghead">
    <button class="iconbtn" data-action="leave" aria-label="${esc(t('game.leave'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="prog" aria-hidden="true">${bars}</div>
    <span class="runscore" id="runscore" aria-label="${esc(t('score.insight'))} ${s.score}"><small>${esc(t('score.insight'))}</small><span id="runscoreval">${fmt(s.score)}</span></span></header>
    <div class="gmeta"><span class="pips" aria-label="${esc(TC.i18n.f('focus.left', { n:s.focus }))}">${esc(t('focus.label'))} ${[0,1,2].map(i => `<i class="${i < s.focus ? '' : 'u'}"></i>`).join('')}</span>
      ${tier ? `<span class="tier ${tier}">◆ ${esc(t('score.tiers.' + tier))}</span>` : ''}
      <span class="count" aria-label="${esc(TC.i18n.f('game.progress', { i:s.index + 1, n:s.total }))}">${s.index + 1}/${s.total}</span></div>`;
};

/* ---- fast-bonus bar: pure CSS, resumes at the right point after re-renders ---- */
function fastBar(s){
  if (s.phase !== 'question') return '';
  const q = s.question, win = TC.scoring.fastWindow(q);
  if (ui2.qStart[s.index] == null) ui2.qStart[s.index] = performance.now();
  const el = performance.now() - ui2.qStart[s.index];
  if (el >= win) return '';
  return `<div class="fastbar${q.type === 'decision' ? ' urgent' : ''}" aria-hidden="true"><i style="animation-duration:${win}ms;animation-delay:-${Math.round(el)}ms"></i></div><span class="fastlbl" aria-hidden="true">${esc(t('score.fastBonus'))} +${TC.scoring.RULES.fast}</span>`;
}

/* ---- Focus tools + clue ---- */
const TOOL_ICON = { remove:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>', source:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>', anchor:'<circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/>' };
function toolsHTML(s){
  if (s.phase !== 'question') return '';
  const fam = TC.schema.FAMILY(s.question.type);
  const list = fam === 'order' ? ['anchor', 'source'] : fam === 'binary' ? ['source'] : ['remove', 'source'];
  return `<div class="tools" role="group" aria-label="${esc(TC.i18n.f('focus.left', { n:s.focus }))}">${list.map(tl => `<button class="tool" data-action="focus" data-tool="${tl}"${s.canUse(tl) ? '' : ' disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TOOL_ICON[tl]}</svg>${esc(t('focus.' + tl))}</button>`).join('')}</div>`;
}
function clueHTML(s){
  const used = s.toolsUsed; let h = '';
  if (used.includes('source')) h += `<p class="clue" role="status">${esc(TC.i18n.f('focus.clue', { t:s.question.sources[0].title.replace(/^Wikipedia: /, '') }))}</p>`;
  if (used.includes('anchor') && s.phase === 'question') h += `<p class="clue" role="status">${esc(t('focus.anchored'))}</p>`;
  return h;
}

/* ---- action bar: hint → confidence + lock → next ---- */
ui.game.action = s => {
  if (s.phase === 'question') {
    if (!s.canLock()) return `<div class="actionbar"><p class="choosehint">${esc(t('game.chooseHint'))}</p></div>`;
    const c = ui2.confidence;
    return `<div class="actionbar"><div class="lockpanel">
      <div class="conf" role="group" aria-label="${esc(t('confidence.label'))}"><button data-action="confidence" data-value="safe" aria-pressed="${c === 'safe'}">${esc(t('confidence.safe'))}</button><button class="sure" data-action="confidence" data-value="sure" aria-pressed="${c === 'sure'}">${esc(t('confidence.sure'))}</button></div>
      ${c === 'sure' ? `<p class="confnote">${esc(t('confidence.note'))}</p>` : ''}
      <button class="btn btn-primary" style="width:100%" data-action="lock">${esc(t('game.lockIn'))}</button></div></div>`;
  }
  const last = s.index + 1 >= s.total;
  return `<div class="actionbar"><button class="btn btn-primary" style="width:100%" data-action="next">${esc(t(last ? 'game.finish' : 'game.next'))}</button></div>`;
};

/* ---- reveal: points line + ledger entries ---- */
const baseReveal = ui.game.reveal;
ui.game.reveal = (s, u) => {
  const r = s.result; if (!r) return '';
  let h = baseReveal(s, u);
  const parts = r.parts.map(([k, v]) => `${esc(t('score.parts.' + k))} ${v > 0 ? '+' : ''}${v}`).join(' · ');
  const line = `<p class="ptsline"><b class="${r.points < 0 ? 'neg' : ''}">${r.points >= 0 ? '+' : ''}${fmt(r.points)}</b>${parts ? ' · ' + parts : ''}</p>`;
  h = h.replace('</h2>', '</h2>' + line);
  const q = s.question;
  if (q.ledger && q.ledger.length) {
    const card = `<div class="card ledger glass"><h3>${esc(t('ledger.title'))}</h3><ul>${q.ledger.map(l => `<li><span class="lv">${esc(TC.i18n.tx(l.value))}</span><span class="ll">${ui2.newLedger.includes(l.id) ? `<span class="new">${esc(t('ledger.newEntry'))}</span> ` : ''}${esc(TC.i18n.tx(l.label))}<a href="${esc(l.source.url)}" target="_blank" rel="noopener noreferrer">${esc(l.source.title)}</a></span></li>`).join('')}</ul></div>`;
    h = h.replace('<div class="card src', card + '<div class="card src');
  }
  return h;
};

SCREENS.game.view = () => {
  if (!session || session.phase === 'complete') return '';
  const s = session;
  return `<section class="screen" aria-label="${esc(TC.i18n.f('game.progress', { i:s.index + 1, n:s.total }))}">
    ${ui.game.header(s)}
    <div class="gamebody">
      ${ui.game.question(s)}
      ${fastBar(s)}
      ${coachHTML()}
      <div id="answers">${ui.game.answers(s)}</div>
      ${clueHTML(s)}
      ${toolsHTML(s)}
      ${ui2.pendingReveal ? '' : ui.game.reveal(s, ui2)}
      ${ui.game.action(s)}
    </div></section>`;
};

/* ---- verdict moment ---- */
function verdictFX(r, s){
  const q = s.question, decision = q.type === 'decision', tier = r.correct ? TC.scoring.tier(r.streak) : null;
  const word = decision ? t(r.correct ? 'game.happened' : 'game.otherWay') : t(r.correct ? 'game.correct' : 'game.notQuite');
  const d = document.createElement('div'); d.className = 'vfx ' + (r.correct ? 'ok' : 'no'); d.setAttribute('aria-hidden', 'true');
  d.innerHTML = `<div class="vb"><div class="vw${word.length > 12 ? ' long' : ''}">${esc(word)}</div>${r.points ? `<div class="vp">${r.points > 0 ? '+' : ''}${fmt(r.points)}</div>` : ''}${r.parts.length > 1 ? `<div class="vs">${esc(r.parts.map(([k, v]) => t('score.parts.' + k) + ' ' + (v > 0 ? '+' : '') + v).join(' · '))}</div>` : ''}${tier && [3,5,10].includes(r.streak) ? `<div class="vt">${esc(t('score.tiers.' + tier))}</div>` : ''}</div>`;
  document.body.appendChild(d);
  const dur = TC.motion.reduced ? 500 : 1300;
  setTimeout(() => d.remove(), dur);
  return dur;
}
function bumpScore(from, to){
  const el = document.getElementById('runscoreval'), chip = document.getElementById('runscore'); if (!el) return;
  chip.classList.add('bump'); setTimeout(() => chip.classList.remove('bump'), 450);
  if (TC.motion.reduced) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  (function step(now){ const k = Math.min(1, (now - t0) / 700); el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); })(t0);
}

Object.assign(ACTIONS, {
  confidence: el => { ui2.confidence = el.dataset.value; TC.audio.tap(); renderGame(); const b = app.querySelector(`[data-action="confidence"][data-value="${el.dataset.value}"]`); b && b.focus({ preventScroll:true }); },
  focus: el => {
    if (!session || !session.useFocus(el.dataset.tool)) return;
    TC.audio.whoosh(); saveRun(); renderGame();
    announce(TC.i18n.f('focus.left', { n:session.focus }));
  },
  lock: () => {
    if (!session || !session.canLock()) return;
    const from = session.score;
    const r = session.lock({ elapsedMs: ui2.qStart[session.index] != null ? performance.now() - ui2.qStart[session.index] : null, confidence:ui2.confidence });
    if (!r) return;
    ui2.sourcesOpen = false; ui2.confidence = 'safe'; saveRun();
    r.correct ? TC.audio.chime() : TC.audio.whoosh();
    if (navigator.vibrate) { try { navigator.vibrate(r.correct ? 25 : [15, 50, 15]); } catch (e) {} }
    ui2.pendingReveal = true; renderGame();                       // answers marked, reveal held back
    const dur = verdictFX(r, session);
    bumpScore(from, session.score);
    announce((r.correct ? t('game.correct') : t('game.notQuite')) + ' ' + TC.i18n.f('game.pointsLine', { n:r.points }));
    setTimeout(() => { ui2.pendingReveal = false; if (current === 'game') renderGame(true); }, Math.max(300, dur - 250));
  },
  startOverReset: () => {}
});
const baseNext = ACTIONS.next;
ACTIONS.next = () => { ui2.newLedger = []; baseNext(); };
const baseStart = startChapter;
startChapter = function(id, fresh){ ui2.qStart = {}; ui2.confidence = 'safe'; ui2.newLedger = []; ui2.pendingReveal = false; baseStart(id, fresh); };

/* source links inside the game earn +10 once per question */
app.addEventListener('click', e => {
  const a = e.target.closest('.srclist a, .card.ledger a'); if (!a || current !== 'game' || !session) return;
  const from = session.score;
  if (session.openSource()) { saveRun(); bumpScore(from, session.score); ui.toast(TC.i18n.f('score.sourceToast', { n:TC.scoring.RULES.source })); }
});

/* ---- results with Insight score ---- */
const baseResults = SCREENS.results.view;
SCREENS.results.view = () => {
  let h = baseResults(); if (!h) return h;
  const sum = session.summary();
  const fresh = (TC.bank.get(sum.results[0].id) ? sum.results : []).flatMap(r => (TC.bank.get(r.id).ledger || []));
  const big = `<p class="bigstat" id="bigscore" data-to="${sum.score}">0</p><p class="lab">${esc(t('results.insight'))}</p><p class="bonusline">${esc(TC.i18n.f('results.bonus', { n:sum.bonus }))}</p>
    <div class="stats4">
      <div class="stat glass"><b>${sum.correct}/${sum.total}</b><span>${esc(t('results.correctShort'))}</span></div>
      <div class="stat glass"><b>${Math.round(sum.correct / sum.total * 100)}%</b><span>${esc(t('results.accuracy'))}</span></div>
      <div class="stat glass"><b>${sum.bestStreak}</b><span>${esc(t('results.bestStreak'))}</span></div>
      <div class="stat glass"><b>${sum.sourcesOpened}</b><span>${esc(t('results.sources'))}</span></div>
    </div>
    ${fresh.length ? `<div class="card ledger glass" style="margin-top:14px"><h3>${esc(t('results.ledger'))}</h3><ul>${fresh.map(l => `<li><span class="lv">${esc(TC.i18n.tx(l.value))}</span><span class="ll">${esc(TC.i18n.tx(l.label))}</span></li>`).join('')}</ul></div>` : ''}`;
  h = h.replace(/<p class="bigstat">[\s\S]*?<\/div><\/div>/, big);
  return h;
};
AFTER_RESULTS: {
  const mountBase = SCREENS.results;
  mountBase.after = () => {
    const el = document.getElementById('bigscore'); if (!el) return;
    const to = +el.dataset.to;
    if (TC.motion.reduced) { el.textContent = fmt(to); return; }
    TC.audio.chime(); const t0 = performance.now();
    (function step(now){ const k = Math.min(1, (now - t0) / 1400); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1 && current === 'results') requestAnimationFrame(step); })(t0);
  };
}

/* ---- menu: only what works, plus your stats ---- */
SCREENS.menu.view = () => {
  const tt = totals(), led = progress().ledger || [], all = allLedger().length;
  return `<section class="screen" aria-labelledby="menu-title">
    ${ui.topbar()}
    <div class="menu-hero"><h1 id="menu-title" style="margin:0">${ui.logo()}</h1><p class="tagline" style="font-size:15px">${esc(t('brand.tagline'))}</p></div>
    <div class="menustats">
      <div class="glass"><b>${fmt(tt.insight)}</b><span>${esc(t('menu.statInsight'))}</span></div>
      <div class="glass"><b>${tt.bestStreak}</b><span>${esc(t('menu.statStreak'))}</span></div>
      <div class="glass"><b>${led.length}/${all}</b><span>${esc(t('menu.statLedger'))}</span></div>
    </div>
    <nav class="nav" aria-label="${esc(t('common.menuLabel'))}">
      ${ui.continueItem()}
      <button class="btn btn-primary" data-action="nav" data-to="play">${icon('play')} ${esc(t('menu.play'))}</button>
      ${ui.navItem({ id:'settings', iconName:'settings', label:t('menu.settings') })}
    </nav></section>`;
};
const baseStartAction = ACTIONS.start;
ACTIONS.start = () => { const p = progress(); if (!p.introSeen) { p.introSeen = true; saveProgress(p); } baseStartAction(); };

/* ---- boot ---- */
let booted = false;
TC.i18n.apply(); TC.motion.apply();
if (TC.motion.mq.addEventListener) TC.motion.mq.addEventListener('change', () => TC.motion.apply());
document.addEventListener('visibilitychange', () => TC.audio.suspend(document.hidden));
mount('loading'); motes();
const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
Promise.all([
  Promise.race([fontsReady.catch(() => {}), new Promise(r => setTimeout(r, 2500))]),
  new Promise(r => setTimeout(r, TC.motion.reduced ? 300 : 1500))
]).then(() => {
    renderBackground(TC.motion.reduced);
    requestAnimationFrame(() => document.getElementById('bgmap').classList.add('on'));
    mount('intro', { fast:TC.motion.reduced, quick:!!(TC.storage.getSection('progress') || {}).introSeen });
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  });
})(window.TC);
</script>
</body>
